name: CI & Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，新的取代舊的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 卡牌邏輯健全性測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝測試依賴
        run: |
          npm ci
          python -m pip install Pillow
      - name: 執行與本機相同的全量邏輯／素材 gate
        run: npm test
      - name: 語法檢查所有 JS
        run: |
          for f in templates/card-battle/*.js templates/card-pack/*.js scripts/*.js; do node -c "$f" && echo "✓ $f"; done

  e2e:
    name: 對戰引擎 E2E（真瀏覽器 桌機+手機）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝 playwright + chromium
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: 跑與本機相同的對戰 E2E／控制／R67 視覺整合 gate
        run: npm run test:e2e
      - name: RWD 九視口矩陣守門（shell/battle/pack 零違規）
        run: npm run test:rwd
      - name: R67 Fast 3G／4x CPU 與 frame p95 gate
        run: npm run test:r67:performance

  deploy:
    name: 部署 GitHub Pages
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # 只在 push 到 main 時部署（PR 不部署）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 上傳整個專案作為 Pages 內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages 部署佇列偶發壅塞（2026-07-02 曾連續 queued 逾時），預設 10 分鐘不夠
          timeout: 1800000
