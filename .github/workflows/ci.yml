name: CI & Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，新的取代舊的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 卡牌邏輯健全性測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 執行 cards.js 測試
        run: node scripts/test-cards.js
      - name: 語法檢查所有 JS
        run: |
          for f in templates/card-battle/*.js templates/card-pack/*.js scripts/*.js; do node -c "$f" && echo "✓ $f"; done

  e2e:
    name: 對戰引擎 E2E（真瀏覽器 桌機+手機）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝 playwright + chromium
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: 跑對戰 Stage 1 E2E（AI 攻擊權/pendingSpell/Mulligan/壞存檔/場上上限/RWD）
        run: node scripts/test-battle-e2e.js

  deploy:
    name: 部署 GitHub Pages
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # 只在 push 到 main 時部署（PR 不部署）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 設定 Pages
        uses: actions/configure-pages@v5
      - name: 上傳整個專案作為 Pages 內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
