<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>開卡包 · Card Pack</title>
<script>
  (() => {
    const CACHE_VERSION = "card-battle-r52-v1";
    const SW_AUTO_RELOAD_WINDOW_MS = 15000;
    const SW_AUTO_RELOAD_KEY = "card_sw_auto_reload_r52_v1";
    const swPageLoadedAt = Date.now();
    window.__CARD_CACHE_VERSION = CACHE_VERSION;
    window.__CARD_SW_BOOT = { CACHE_VERSION, SW_AUTO_RELOAD_WINDOW_MS, SW_AUTO_RELOAD_KEY, swPageLoadedAt };
    if (!("serviceWorker" in navigator) || window.__cardSwBootGuardInstalled) return;
    window.__cardSwBootGuardInstalled = true;
    const hasReloaded = () => { try { return sessionStorage.getItem(SW_AUTO_RELOAD_KEY) === "1"; } catch { return true; } };
    const markReloaded = () => { try { sessionStorage.setItem(SW_AUTO_RELOAD_KEY, "1"); } catch {} };
    const shouldReload = (now) => (Number(now || Date.now()) - swPageLoadedAt) <= SW_AUTO_RELOAD_WINDOW_MS && !hasReloaded();
    const notify = () => {
      window.__cardSwUpdatePending = true;
      try { window.dispatchEvent(new CustomEvent("card-sw-update-available")); } catch {}
      if (typeof window.__cardSwUpdatePrompt === "function") window.__cardSwUpdatePrompt();
    };
    window.__CARD_SW_BOOT.shouldAutoReloadForSwUpdate = shouldReload;
    // 首次安裝（載入時尚無 controller）取得控制權不是「更新」，不自動重載；
    // 只有原本就受控、被新 SW 接管時才走 15 秒視窗內的一次性自動重載。
    const wasControlledAtBoot = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (window.__cardSwBootReloading) return;
      if (!wasControlledAtBoot) return;
      if (shouldReload()) {
        window.__cardSwBootReloading = true;
        markReloaded();
        location.reload();
        return;
      }
      notify();
    });
    navigator.serviceWorker.getRegistration(new URL("../../", location.href).toString())
      .then((registration) => { if (registration) return registration.update(); })
      .catch(() => {});
  })();
</script>
<style>
  :root {
    --bg1: #1a1430; --bg2: #0d1117; --ink: #e6edf3; --muted: #8b98a8; --accent: #f59e0b;
    --card-w: 132px; --card-h: 186px; --text-scale: 1;
    --bg-img: url("../../assets/backgrounds/dark.png");
  }
  :root[data-theme="fantasy"] { --bg1:#2a1d10; --bg2:#160d05; --accent:#f0a830; --bg-img:url("../../assets/backgrounds/fantasy.png"); }
  :root[data-theme="cyber"]   { --bg1:#0a1626; --bg2:#04070f; --accent:#2dd4bf; --bg-img:url("../../assets/backgrounds/cyber.png"); }
  :root[data-theme="forest"]  { --bg1:#14241a; --bg2:#07120c; --accent:#84cc16; --bg-img:url("../../assets/backgrounds/forest.png"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root[data-text-size="small"] { --text-scale: .92; }
  :root[data-text-size="large"] { --text-scale: 1.14; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid #facc15; outline-offset: 2px;
  }
  html { height: 100%; }
  body {
    font-family: "Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    background: radial-gradient(ellipse at top,var(--bg1),var(--bg2));
    color: var(--ink); height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background-image: var(--bg-img, none); background-size: cover; background-position: center;
    opacity: .5; filter: saturate(1.1);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 50% at 25% 25%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(45% 55% at 75% 75%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.6));
    animation: ambientDrift 20s ease-in-out infinite alternate;
  }
  @keyframes ambientDrift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(2%,-2%) scale(1.06)} }
  header { padding: 6px 8px; font-size: 18px; font-weight: 800; letter-spacing: 2px; flex-shrink: 0;
    color: var(--accent); text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 50%, transparent); }
  /* app-shell 頂列：金幣＋前往對戰同一列，頁面本身不捲動 */
  .pack-topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap; padding: 0 10px 6px; max-width: 100vw; }
  .coin-bar { font-size: 13px; font-weight: 700; color: #facc15; padding: 4px 14px; border-radius: 20px;
    background: rgba(250,204,21,.1); border: 1px solid rgba(250,204,21,.25); margin-bottom: 0; }
  .coin-bar span { font-size: 15px; font-weight: 900; }
  /* app-shell 主格線：所有區段同屏可見、各自垂直內捲 */
  .pack-main {
    flex: 1 1 auto; min-height: 0; width: min(1280px, 100%);
    display: grid; gap: 8px; padding: 0 10px 8px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1.25fr);
    grid-template-areas: "goal open record" "deck deck collection";
  }
  .open-panel { grid-area: open; display: flex; flex-direction: column; align-items: center; }
  .goal-panel { grid-area: goal; }
  .record-panel { grid-area: record; }
  .deck-builder { grid-area: deck; display: flex; flex-direction: column; }
  .collection { grid-area: collection; }
  .open-panel, .goal-panel, .record-panel, .deck-builder, .collection {
    min-height: 0; max-height: 100%; overflow-y: auto; width: auto; margin: 0;
    background: rgba(13,17,23,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
  }
  @media (max-width: 1179px) and (min-width: 701px) {
    .pack-main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "open deck" "goal record" "collection collection";
    }
  }

  /* 卡包 */
  .pack-stage { min-height: 0; flex-shrink: 0; width: 100%; padding: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .pack {
    width: 180px; height: 250px; border-radius: 18px; cursor: pointer;
    background: linear-gradient(160deg,#7c3aed,#4c1d95); border: 3px solid #a855f7;
    box-shadow: 0 0 36px rgba(168,85,247,.6), inset 0 0 30px rgba(0,0,0,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; position: relative; transition: transform .2s; animation: floaty 3s ease-in-out infinite; overflow: hidden;
  }
  .pack::before { content:""; position:absolute; inset:0; background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
    background-size:250% 250%; animation: foilShine 3s linear infinite; }
  .pack:hover { transform: scale(1.06) rotate(-2deg); }
  .pack.opening { animation: packBurst .6s ease forwards; }
  .pack .pack-icon { font-size: 64px; filter: drop-shadow(0 0 12px gold); z-index:1; }
  .pack .pack-label { font-weight: 800; font-size: 18px; z-index:1; }
  .pack .pack-hint { font-size: 12px; color: rgba(255,255,255,.75); z-index:1; }

  .reveal-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 18px; min-height: var(--card-h);
    perspective: 1200px; } /* 3D 透視讓翻牌立體（CP1-13）*/
  /* 壓軸卡額外光效（CP1-13）*/
  .card.finale { animation: flipIn .6s ease forwards, finalePulse 1.6s ease .6s 1 !important; z-index: 5; }
  @keyframes finalePulse { 0%,100%{transform:scale(1)} 30%{transform:scale(1.14); box-shadow:0 0 40px var(--glow,gold),0 0 80px var(--glow,gold)} }
  /* 開傳說/閃卡：全螢幕金色 vignette flash（CP1-13）*/
  .legend-flash { position: fixed; inset: 0; pointer-events: none; z-index: 200;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(245,158,11,.55) 100%);
    animation: legendFlashAnim .9s ease-out forwards; }
  @keyframes legendFlashAnim { 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }

  .card {
    width: var(--card-w); height: var(--card-h); border-radius: 12px;
    background: linear-gradient(160deg,#222d3d,#18222f); border: 3px solid var(--rarity,#9aa5b1);
    box-shadow: 0 0 18px var(--glow,transparent), 0 6px 16px rgba(0,0,0,.5);
    position: relative; display: flex; flex-direction: column; padding: 8px;
    transform-style: preserve-3d; opacity: 0;
  }
  .card.flip-in { animation: flipIn .55s ease forwards; }
  .card.rare-pull   { animation: flipIn .55s ease forwards, rarityShine 1.4s ease .55s 1; }
  .card.legend-pull { animation: flipIn .55s ease forwards, legendShine 1.8s ease .55s 1; }
  /* 稀有度後方光柱 */
  .card .beam { position:absolute; inset:0; border-radius:12px; pointer-events:none; opacity:0; }
  .card.legend-pull .beam, .card.rare-pull .beam { animation: beamFlash 1.4s ease .4s; }
  .card .beam::after { content:""; position:absolute; left:50%; top:-40%; width:60%; height:180%; transform:translateX(-50%) rotate(8deg);
    background: linear-gradient(180deg, var(--glow), transparent); filter:blur(8px); }

  .card .art { flex:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:52px;
    background: radial-gradient(circle,rgba(255,255,255,.08),transparent); overflow:hidden; }
  .card .art img { width:100%; height:100%; object-fit:cover; }
  .card .cost { position:absolute; top:-10px; left:-10px; width:30px; height:30px; border-radius:50%;
    background:#3b82f6; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; border:2px solid #0d2c5e; z-index:3; }
  .card .stars { position:absolute; top:-9px; right:6px; font-size:11px; color:var(--rarity); text-shadow:0 0 5px var(--glow); z-index:3; }
  .card .cardname { font-size:13px; font-weight:800; text-align:center; margin-top:4px; }
  .card .rarity-tag { font-size:10px; text-align:center; color:var(--rarity); font-weight:700; letter-spacing:1px; }
  .card .kwrow { display:flex; gap:3px; justify-content:center; min-height:14px; }
  .card .kw { font-size:12px; }
  .card .stats { display:flex; justify-content:space-between; margin-top:2px; }
  .card .atk,.card .hp { width:26px; height:26px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .card .atk { background:#d97706; } .card .hp { background:#ef4444; }
  .card.spell .stats, .card.spell .kwrow { display:none; }
  /* 閃卡 */
  .card.foil { border-width:4px; box-shadow:0 0 26px gold, 0 6px 16px rgba(0,0,0,.5); }
  .card.foil::after { content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
    background-size:250% 250%; animation:foilShine 2s linear infinite; mix-blend-mode:screen; }
  .card .foil-tag { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800;
    color:#1a1206; background:linear-gradient(90deg,#fde047,#f59e0b); padding:1px 8px; border-radius:8px; z-index:3; }
  .card.tide { border-color:#38bdf8; box-shadow:0 0 24px rgba(56,189,248,.72),0 6px 16px rgba(0,0,0,.5); }
  .card.tide::before { content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(135deg,rgba(125,211,252,0) 0 9px,rgba(125,211,252,.26) 10px 12px,rgba(14,165,233,0) 13px 22px);
    mix-blend-mode:screen; }
  .card .tide-tag { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800;
    color:#062133; background:linear-gradient(90deg,#7dd3fc,#38bdf8); padding:1px 8px; border-radius:8px; z-index:3; }
  /* 重複標記 */
  .card .dup-tag { position:absolute; top:8px; right:6px; font-size:10px; font-weight:800; color:#fff;
    background:rgba(0,0,0,.6); padding:1px 6px; border-radius:8px; z-index:3; }
  .card .new-card-tag { position:absolute; top:8px; right:6px; font-size:10px; font-weight:900; color:#052e16;
    background:linear-gradient(180deg,#86efac,#22c55e); padding:1px 6px; border-radius:8px; z-index:3; }

  .actions { display:flex; gap:12px; padding:12px; flex-wrap:wrap; justify-content:center; flex-shrink:0; }
  .reveal-row { flex-shrink: 0; }
  button { background:linear-gradient(180deg,var(--accent),#d97706); color:#1a1206; border:none; padding:12px 24px;
    border-radius:24px; font-size:15px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent); transition:transform .1s; }
  button:hover { transform:scale(1.05); }
  button.ghost { background:#2a3645; color:var(--ink); box-shadow:none; }
  button:disabled { filter:grayscale(1) brightness(.65); cursor:not-allowed; transform:none; }
  .top-actions { display:flex; justify-content:center; gap:10px; padding:0; }
  .top-actions button { padding:6px 14px; font-size:13px; border-radius:16px; }

  .summary { font-size:13px; color:var(--muted); text-align:center; min-height:20px; }
  .summary .new { color:#4ade80; font-weight:700; } .summary .dup { color:#f59e0b; }

  /* 收藏冊 */
  .collection { padding:12px; }
  .collection h2 { font-size:16px; margin-bottom:10px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  .collection-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; font-size:12px; }
  .collection-tools { display:grid; grid-template-columns:minmax(150px,1.2fr) repeat(5,minmax(96px,.6fr)); gap:8px; margin-bottom:10px; }
  .collection-tools input, .collection-tools select { min-width:0; border:1px solid rgba(255,255,255,.12); border-radius:8px;
    background:rgba(8,12,18,.84); color:var(--ink); padding:9px 10px; font:inherit; font-size:13px; }
  .collection .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; }
  .slot { aspect-ratio:5/7; border-radius:8px; border:2px solid #2a3645; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:24px; background:#131a24; position:relative; overflow:hidden; }
  .slot.owned { border-color:var(--rarity); box-shadow:0 0 8px var(--glow); }
  .slot.foil { border-color:gold; box-shadow:0 0 12px gold; }
  .slot.tide { border-color:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,.82); }
  .slot.tide::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(125,211,252,0) 0 8px,rgba(125,211,252,.22) 9px 11px,rgba(14,165,233,0) 12px 20px); mix-blend-mode:screen; }
  .slot.locked { filter:grayscale(1) brightness(.4); }
  .slot img { width:34px; height:34px; object-fit:cover; border-radius:4px; }
  .slot .count { position:absolute; bottom:2px; right:4px; font-size:10px; color:var(--accent); font-weight:800; }
  .slot .nm { font-size:8px; color:var(--muted); }
  /* 重複卡分解按鈕（CP2-7）——bottom:0 必須留在格子內，slot 有 overflow:hidden，
     負值會被裁掉一半，觸控裝置上只剩不到 10px 可點 */
  .slot .dismantle-btn { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:700; padding:4px 6px; min-height:20px; border-radius:8px 8px 0 0; white-space:nowrap;
    background:#facc15; color:#3a2a06; border:none; cursor:pointer; opacity:0; transition:opacity .15s; z-index:4; }
  .slot:hover .dismantle-btn { opacity:1; }
  @media (hover:none) { .slot .dismantle-btn { opacity:1; } } /* 觸控裝置常駐顯示 */
  .slot .fstar { position:absolute; top:2px; right:3px; font-size:9px; color:gold; }
  .slot .tide-mark { color:#7dd3fc; }

  .deck-builder { padding:12px; }
  .deck-head { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .deck-head h2 { font-size:18px; color:var(--ink); }
  .deck-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .deck-actions button { padding:8px 14px; font-size:13px; border-radius:14px; }
  .deck-count { color:#facc15; font-weight:900; min-width:54px; text-align:right; }
  /* 牌組雙欄各自內捲：deck-panel 是唯一的捲動層（清單不再另設高度） */
  .deck-layout { flex:1 1 auto; min-height:0; display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); grid-template-rows:minmax(0,1fr); gap:12px; align-items:stretch; }
  .deck-panel { background:rgba(13,17,23,.55); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:12px;
    min-width:0; min-height:0; max-height:100%; overflow-y:auto; }
  .deck-panel h3 { font-size:14px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; gap:8px; }
  .deck-tools { display:grid; grid-template-columns:minmax(120px,1fr) minmax(88px,.35fr) minmax(100px,.4fr); gap:8px; margin-bottom:10px; }
  .deck-tools input, .deck-tools select { min-width:0; border:1px solid rgba(255,255,255,.12); border-radius:8px;
    background:rgba(8,12,18,.84); color:var(--ink); padding:9px 10px; font:inherit; font-size:13px; }
  .deck-filter-count { font-size:11px; color:var(--muted); }
  .deck-card-list { display:flex; flex-direction:column; gap:7px; padding-right:2px; }
  .deck-card-row { display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:8px; align-items:center;
    min-height:46px; padding:7px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
  .deck-card-row.locked { opacity:.48; }
  .deck-card-row.over { border-color:#f87171; }
  .deck-card-row.blocked-add { cursor:not-allowed; }
  .deck-art { width:34px; height:34px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; background:rgba(255,255,255,.08); font-size:22px; }
  .deck-art img { width:100%; height:100%; object-fit:cover; }
  .deck-name { font-size:13px; font-weight:800; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .deck-meta { font-size:11px; color:var(--muted); margin-top:2px; }
  .deck-add-btn, .deck-remove-btn { min-width:42px; padding:7px 10px; border-radius:8px; font-size:13px; }
  .deck-recommend { margin-top:10px; display:flex; flex-direction:column; gap:6px; font-size:12px; }
  .deck-recommend-card { border:1px solid rgba(250,204,21,.35); border-radius:8px; padding:8px;
    background:rgba(250,204,21,.08); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; }
  .deck-recommend-title { color:#facc15; font-weight:900; margin-bottom:2px; }
  .deck-recommend-reason { color:var(--muted); line-height:1.35; }
  .deck-recommend button { padding:7px 10px; border-radius:8px; font-size:12px; white-space:nowrap; }
  .deck-stats { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .deck-ratio { display:flex; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--muted); }
  .ratio-pill { border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:4px 8px; background:rgba(255,255,255,.05); }
  .curve-grid { display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:4px; align-items:end; min-height:74px; }
  .curve-cell { min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; }
  .curve-bar { width:100%; min-height:4px; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,#facc15,#d97706); box-shadow:0 0 8px rgba(250,204,21,.24); }
  .curve-count { color:#facc15; font-weight:900; font-size:11px; }
  .deck-errors { margin-top:10px; display:flex; flex-direction:column; gap:4px; color:#fca5a5; font-size:12px; line-height:1.35; }
  .deck-errors.ok { color:#86efac; }
  .deck-save-msg { color:#86efac; font-size:12px; min-height:16px; }
  .deck-empty { color:var(--muted); font-size:13px; padding:12px; text-align:center; }
  .goal-panel { padding:12px; }
  .goal-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .goal-head h2 { font-size:16px; color:var(--ink); }
  .goal-summary { font-size:12px; color:var(--muted); }
  .goal-grid { display:grid; grid-template-columns:1fr; gap:10px; align-items:start; }
  .milestone-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:7px; }
  .goal-item { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px; background:rgba(255,255,255,.04); min-width:0; }
  .goal-title { font-size:12px; font-weight:900; color:#facc15; margin-bottom:3px; }
  .goal-progress { font-size:11px; color:var(--muted); margin-bottom:7px; }
  .goal-item button { width:100%; padding:7px 9px; border-radius:8px; font-size:12px; }
  .goal-item.claimed { opacity:.62; }
  .weekly-goal { border-color:rgba(45,212,191,.38); background:rgba(45,212,191,.07); }
  .weekly-goal .goal-title { color:#5eead4; }
  .record-panel { padding:12px; }
  .record-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .record-head h2 { font-size:16px; color:var(--ink); }
  .record-head button { padding:7px 10px; border-radius:8px; font-size:12px; }
  .record-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pwa-save-tools { margin-top: 8px; }
  .record-tools select { background:rgba(15,23,42,.9); color:var(--ink); border:1px solid rgba(255,255,255,.14);
    border-radius:8px; padding:7px 9px; font-size:12px; font-weight:800; }
  .version-pill { border:1px solid rgba(250,204,21,.28); border-radius:999px; padding:6px 9px; color:#facc15; font-size:12px; font-weight:900; background:rgba(250,204,21,.08); }
  .save-manager { margin-top:10px; display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; }
  .save-manager textarea { min-height:38px; max-height:90px; resize:vertical; border-radius:8px; padding:8px;
    background:rgba(15,23,42,.92); color:var(--ink); border:1px solid rgba(255,255,255,.14);
    font:12px/1.4 ui-monospace, Consolas, monospace; }
  .record-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; }
  .record-card { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px; background:rgba(255,255,255,.04); }
  .record-title { font-size:12px; color:#facc15; font-weight:900; margin-bottom:5px; }
  .record-value { font-size:12px; color:var(--muted); line-height:1.55; white-space:pre-line; }
  .card .cardname, .deck-name { font-size: calc(13px * var(--text-scale)); }
  .record-value, .goal-progress, .mission-progress, .deck-meta, .deck-errors, .deck-save-msg { font-size: calc(12px * var(--text-scale)); }
  .mission-name, .goal-title, .record-title { font-size: calc(12px * var(--text-scale)); }
  .mission-drawer-btn { position: fixed; bottom: 12px; left: 12px; z-index: 90; background: #1a2230;
    color: #e6edf3; border: 1px solid rgba(255,255,255,.15); padding: 8px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mission-badge { position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:999px;
    background:#ef4444; color:#fff; display:none; align-items:center; justify-content:center; font-size:11px; padding:0 5px; }
  .mission-badge.show { display:flex; }
  .mission-drawer { position:fixed; inset:0; z-index:135; display:none; align-items:flex-end; justify-content:center;
    background:rgba(6,10,14,.7); padding:12px; }
  .mission-drawer.show { display:flex; }
  .mission-card { width:min(720px,96vw); max-height:86vh; overflow-y:auto; border-radius:16px 16px 10px 10px;
    background:linear-gradient(180deg,#1a2230,#0f1620); border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 48px rgba(0,0,0,.58); padding:14px; }
  .mission-head { position:sticky; top:0; z-index:2; background:linear-gradient(180deg,#1a2230,#151c28);
    display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:10px; margin-bottom:10px; }
  .mission-title { font-size:18px; font-weight:900; color:var(--accent); }
  .mission-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .mission-actions button { border:none; border-radius:10px; padding:8px 10px; font-weight:900; cursor:pointer; }
  .mission-claim-all { background:linear-gradient(180deg,#facc15,#eab308); color:#271a02; }
  .mission-close { background:#2a3645; color:var(--ink); }
  .mission-section { margin-top:10px; }
  .mission-section h3 { font-size:13px; color:#facc15; margin-bottom:6px; }
  .mission-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:7px; }
  .mission-item { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px; background:rgba(255,255,255,.04); }
  .mission-item.ready { border-color:rgba(250,204,21,.5); background:rgba(250,204,21,.08); }
  .mission-item.claimed { opacity:.6; }
  .mission-name { font-size:12px; font-weight:900; color:var(--ink); margin-bottom:4px; }
  .mission-progress { font-size:11px; color:var(--muted); margin-bottom:7px; }
  .mission-item button { width:100%; border:none; border-radius:8px; padding:7px 9px; font-size:12px; font-weight:900;
    background:linear-gradient(180deg,#facc15,#eab308); color:#271a02; cursor:pointer; }
  .mission-item button:disabled, .mission-actions button:disabled { background:#2a3645; color:var(--muted); cursor:default; filter:none; }
  .series-footer { flex-shrink:0; width:min(960px,94vw); margin:0 auto; padding:4px 10px 6px;
    color:var(--muted); font-size:12px; text-align:center; border-top:1px solid rgba(255,255,255,.08); }
  .series-footer a { color:var(--accent); text-decoration:none; font-weight:800; margin:0 6px; }
  .series-footer a:hover { text-decoration:underline; }

  @media (max-width:700px) {
    header { padding: 4px 8px; font-size: 16px; }
    .pack-main {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1.45fr) minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr);
      grid-template-areas: "open" "deck" "goal" "record" "collection";
      gap: 6px; padding: 0 8px 6px;
    }
    .pack { width: 132px; height: 184px; }
    .pack .pack-icon { font-size: 44px; }
    .collection h2 { align-items:flex-start; gap:8px; }
    .collection-tools { grid-template-columns:1fr 1fr; }
    .collection-tools input { grid-column:1 / -1; }
    .deck-layout { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1fr); }
    .deck-tools { grid-template-columns:1fr 1fr; }
    .deck-tools input { grid-column:1 / -1; }
    .deck-card-row { grid-template-columns:32px minmax(0,1fr) auto; }
    .deck-head { align-items:flex-start; }
    .deck-actions { width:100%; }
    .deck-actions button { flex:1 1 auto; padding-inline:10px; }
    .deck-current-panel { order:-1; border-color:rgba(250,204,21,.35); }
    .milestone-list { grid-template-columns:1fr; }
    .record-grid { grid-template-columns:1fr; }
    .save-manager { grid-template-columns:1fr 1fr; }
    .save-manager textarea { grid-column:1 / -1; }
    .mission-drawer-btn { top: 8px; bottom: auto; left: 10px; z-index: 90; }
    .mission-drawer { align-items:flex-start; padding:50px 8px 8px; }
    .mission-card { max-height:calc(100vh - 64px); padding:12px; }
    .mission-list { grid-template-columns:1fr; }
    .mission-actions button { padding:8px 9px; }
  }
  @media (max-height: 760px) {
    header { padding: 3px 8px; font-size: 15px; }
    .pack-topbar { padding-bottom: 4px; }
    .coin-bar { font-size: 12px; padding: 3px 10px; }
    .top-actions button { padding: 4px 12px; font-size: 12px; }
    .pack { width: 120px; height: 168px; }
    .pack .pack-icon { font-size: 40px; }
    .pack .pack-label { font-size: 14px; }
    .series-footer { padding: 2px 8px 4px; font-size: 11px; }
    .mission-card { max-height: calc(100vh - 40px); overflow-y: auto; }
  }
  @media (max-height: 560px) {
    header { padding: 2px 8px; font-size: 13px; }
    .pack { width: 96px; height: 134px; }
    .pack .pack-icon { font-size: 30px; }
    .pack .pack-hint { display: none; }
    .series-footer { padding: 1px 8px 3px; font-size: 10px; }
  }

  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes foilShine { 0%{background-position:0% 0%} 100%{background-position:250% 250%} }
  @keyframes packBurst { to { transform:scale(1.4); opacity:0; } }
  @keyframes flipIn { 0%{transform:rotateY(90deg) scale(.7);opacity:0} 100%{transform:rotateY(0) scale(1);opacity:1} }
  @keyframes rarityShine { 0%,100%{box-shadow:0 0 18px var(--glow),0 6px 16px rgba(0,0,0,.5)} 50%{box-shadow:0 0 34px var(--glow),0 0 60px var(--glow)} }
  @keyframes legendShine { 0%,100%{box-shadow:0 0 18px var(--glow),0 6px 16px rgba(0,0,0,.5)} 50%{box-shadow:0 0 50px gold,0 0 90px rgba(245,158,11,.7)} }
  @keyframes beamFlash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>
  <header>🎴 開卡包 · CARD PACK 🎴</header>
  <button class="mission-drawer-btn" id="missionDrawerBtn">任務<span class="mission-badge" id="missionBadge" aria-live="polite">0</span></button>
  <div class="pack-topbar">
    <div class="coin-bar">💰 金幣 <span id="coinBalance" aria-live="polite">0</span> · 一包 100 金（首包免費）</div>
    <div class="top-actions">
      <button class="ghost" id="goBattleTop">前往對戰</button>
    </div>
  </div>

  <main class="pack-main">
  <section class="goal-panel" id="goalPanel">
    <div class="goal-head">
      <h2>長線目標</h2>
      <div class="goal-summary" id="goalSummary" aria-live="polite"></div>
    </div>
    <div class="goal-grid">
      <div class="milestone-list" id="milestoneList"></div>
      <div class="goal-item weekly-goal" id="weeklyGoal"></div>
    </div>
  </section>

  <section class="record-panel" id="recordPanel">
    <div class="record-head">
      <h2>戰績</h2>
      <div class="record-tools">
        <select id="recordDifficultyFilter" aria-label="戰績難度篩選">
          <option value="all">全部難度</option>
          <option value="easy">簡單</option>
          <option value="normal">普通</option>
          <option value="hard">困難</option>
        </select>
        <button class="ghost" id="copyRecordBtn">複製 JSON</button>
        <button class="ghost" id="clearRecordBtn">清除戰績</button>
      </div>
    </div>
    <div class="record-grid" id="recordGrid"></div>
    <div class="record-tools pwa-save-tools">
      <select id="packTextSizeSel" aria-label="文字大小">
        <option value="small">小</option>
        <option value="medium" selected>中</option>
        <option value="large">大</option>
      </select>
      <span class="version-pill" id="packPwaVersion">版本讀取中</span>
      <button class="ghost" id="packPwaCheckBtn" type="button">檢查更新</button>
    </div>
    <div class="save-manager">
      <textarea id="saveImportText" placeholder="貼上 Base64 存檔碼"></textarea>
      <button class="ghost" id="exportSaveBtn">匯出存檔</button>
      <button class="ghost" id="importSaveBtn">匯入存檔</button>
    </div>
  </section>

  <section class="open-panel" id="openPanel">
    <div class="pack-stage" id="packStage">
      <div class="pack" id="pack">
        <div class="pack-icon">🎁</div>
        <div class="pack-label">神祕卡包</div>
        <div class="pack-hint">點擊開啟（5 張）</div>
      </div>
    </div>

    <div class="reveal-row" id="revealRow"></div>
    <div class="summary" id="summary" aria-live="polite"></div>

    <div class="actions" id="actions" style="display:none;">
      <button id="againBtn">再開一包 🎁</button>
      <button class="ghost" id="toBattleBtn">前往對戰 →</button>
    </div>
  </section>

  <div class="mission-drawer" id="missionDrawer" aria-hidden="true">
    <div class="mission-card">
      <div class="mission-head">
        <div class="mission-title">任務中心</div>
        <div class="mission-actions">
          <button class="mission-claim-all" id="missionClaimAllBtn">全部領取</button>
          <button class="mission-close" id="missionDrawerClose">關閉</button>
        </div>
      </div>
      <section class="mission-section">
        <h3>每日任務</h3>
        <div class="mission-list" id="missionDailyList" aria-live="polite"></div>
      </section>
      <section class="mission-section">
        <h3>每週任務</h3>
        <div class="mission-list" id="missionWeeklyList" aria-live="polite"></div>
      </section>
      <section class="mission-section">
        <h3>收藏里程碑</h3>
        <div class="mission-list" id="missionMilestoneList" aria-live="polite"></div>
      </section>
    </div>
  </div>

  <section class="deck-builder" id="deckBuilder">
    <div class="deck-head">
      <h2>牌組編輯器</h2>
      <div class="deck-actions">
        <span class="deck-count" id="deckCount">0/20</span>
        <button id="autoFillDeckBtn">自動補滿</button>
        <button id="aggroTemplateBtn">快攻模板</button>
        <button id="controlTemplateBtn">控制模板</button>
        <button id="saveDeckBtn">儲存牌組</button>
        <button class="ghost" id="clearDeckBtn">清空</button>
      </div>
    </div>
    <div class="deck-layout">
      <div class="deck-panel deck-collection-panel">
        <h3><span>收藏清單</span><span id="deckFilterCount" class="deck-filter-count">全部卡牌</span></h3>
        <div class="deck-tools">
          <input id="deckSearch" type="search" placeholder="搜尋卡名、效果、關鍵字" autocomplete="off" />
          <select id="deckCostFilter" aria-label="費用篩選">
            <option value="all">全部費用</option>
            <option value="0-1">0-1 費</option>
            <option value="2">2 費</option>
            <option value="3">3 費</option>
            <option value="4">4 費</option>
            <option value="5+">5+ 費</option>
          </select>
          <select id="deckRarityFilter" aria-label="稀有度篩選">
            <option value="all">全部稀有度</option>
            <option value="common">普通</option>
            <option value="rare">稀有</option>
            <option value="epic">史詩</option>
            <option value="legendary">傳說</option>
          </select>
        </div>
        <div class="deck-card-list" id="deckCollectionList"></div>
      </div>
      <div class="deck-panel deck-current-panel">
        <h3><span>目前牌組</span><span>依費用排序</span></h3>
        <div class="deck-card-list" id="deckList"></div>
        <div class="deck-stats" id="deckStats">
          <div class="deck-ratio" id="deckRatio"></div>
          <div class="curve-grid" id="deckCurve"></div>
        </div>
        <div class="deck-recommend" id="deckRecommend"></div>
        <div class="deck-errors" id="deckErrors"></div>
        <div class="deck-save-msg" id="deckSaveMsg" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <div class="collection">
    <h2>
      <span>📖 收藏冊</span>
      <span class="collection-meta"><span id="progress"></span><span id="collectionFilterCount"></span></span>
    </h2>
    <div class="collection-tools" id="collectionTools">
      <input id="collectionSearch" type="search" placeholder="搜尋收藏、效果、風味" autocomplete="off" />
      <select id="collectionAxisFilter" aria-label="軸線篩選">
        <option value="all">全部軸線</option>
        <option value="aggro">快攻</option>
        <option value="control">控制</option>
        <option value="neutral">中立</option>
      </select>
      <select id="collectionKeywordFilter" aria-label="關鍵字篩選">
        <option value="all">全部關鍵字</option>
        <option value="taunt">嘲諷</option>
        <option value="charge">衝鋒</option>
        <option value="rush">突襲</option>
        <option value="lifesteal">吸血</option>
        <option value="battlecry">戰吼</option>
        <option value="deathrattle">亡語</option>
        <option value="divineshield">聖盾</option>
        <option value="windfury">風怒</option>
        <option value="poison">劇毒</option>
        <option value="regenerate">回復</option>
        <option value="silence">靜默</option>
      </select>
      <select id="collectionRarityFilter" aria-label="稀有度篩選">
        <option value="all">全部稀有度</option>
        <option value="common">普通</option>
        <option value="rare">稀有</option>
        <option value="epic">史詩</option>
        <option value="legendary">傳說</option>
      </select>
      <select id="collectionOwnershipFilter" aria-label="擁有狀態篩選">
        <option value="all">全部狀態</option>
        <option value="owned">已擁有</option>
        <option value="missing">未擁有</option>
      </select>
      <select id="collectionSort" aria-label="收藏排序">
        <option value="cost">依費用</option>
        <option value="rarity">依稀有度</option>
        <option value="name">依名稱</option>
      </select>
    </div>
    <div class="grid" id="collectionGrid"></div>
  </div>
  </main>

  <footer class="series-footer">
    🎮 阿軒的小遊戲系列
    <a href="https://mars-tw.github.io/tower-defense-skill/" target="_blank" rel="noopener">塔防</a>
    <a href="https://mars-tw.github.io/pixel-idle-farm-skill/" target="_blank" rel="noopener">像素農場</a>
    <a href="https://mars-tw.github.io/ashes-convoy/" target="_blank" rel="noopener">末日射擊</a>
  </footer>

  <script src="../card-battle/cards.js?v=card-battle-r52-v1"></script>
  <script src="../card-battle/core.js?v=card-battle-r52-v1"></script>
  <script src="pack.js?v=card-battle-r52-v1"></script>
  <script>
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "setTheme") document.documentElement.setAttribute("data-theme", e.data.theme);
    });
    try { const t = localStorage.getItem("cardgame_theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
  </script>
</body>
</html>
