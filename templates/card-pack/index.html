<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>開卡包 · Card Pack</title>
<script>
  (() => {
    const CACHE_VERSION = "card-battle-r63-v1";
    const SW_AUTO_RELOAD_WINDOW_MS = 15000;
    const SW_AUTO_RELOAD_KEY = "card_sw_auto_reload_r63_v1";
    const swPageLoadedAt = Date.now();
    window.__CARD_CACHE_VERSION = CACHE_VERSION;
    window.__CARD_SW_BOOT = { CACHE_VERSION, SW_AUTO_RELOAD_WINDOW_MS, SW_AUTO_RELOAD_KEY, swPageLoadedAt };
    if (!("serviceWorker" in navigator) || window.__cardSwBootGuardInstalled) return;
    window.__cardSwBootGuardInstalled = true;
    const hasReloaded = () => { try { return sessionStorage.getItem(SW_AUTO_RELOAD_KEY) === "1"; } catch { return true; } };
    const markReloaded = () => { try { sessionStorage.setItem(SW_AUTO_RELOAD_KEY, "1"); } catch {} };
    const shouldReload = (now) => (Number(now || Date.now()) - swPageLoadedAt) <= SW_AUTO_RELOAD_WINDOW_MS && !hasReloaded();
    const notify = () => {
      window.__cardSwUpdatePending = true;
      try { window.dispatchEvent(new CustomEvent("card-sw-update-available")); } catch {}
      if (typeof window.__cardSwUpdatePrompt === "function") window.__cardSwUpdatePrompt();
    };
    window.__CARD_SW_BOOT.shouldAutoReloadForSwUpdate = shouldReload;
    // 首次安裝（載入時尚無 controller）取得控制權不是「更新」，不自動重載；
    // 只有原本就受控、被新 SW 接管時才走 15 秒視窗內的一次性自動重載。
    const wasControlledAtBoot = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (window.__cardSwBootReloading) return;
      if (!wasControlledAtBoot) return;
      if (shouldReload()) {
        window.__cardSwBootReloading = true;
        markReloaded();
        location.reload();
        return;
      }
      notify();
    });
    navigator.serviceWorker.getRegistration(new URL("../../", location.href).toString())
      .then((registration) => { if (registration) return registration.update(); })
      .catch(() => {});
  })();
</script>
<style>
  :root {
    --bg1: #1a1430; --bg2: #0d1117; --ink: #e6edf3; --muted: #8b98a8; --accent: #f59e0b;
    --card-w: clamp(132px, 7.6vw, 168px); --card-h: calc(var(--card-w) * 1.41); --text-scale: 1;
    --bg-img: url("../../assets/backgrounds/dark.png");
  }
  :root[data-theme="fantasy"] { --bg1:#2a1d10; --bg2:#160d05; --accent:#f0a830; --bg-img:url("../../assets/backgrounds/fantasy.png"); }
  :root[data-theme="cyber"]   { --bg1:#0a1626; --bg2:#04070f; --accent:#2dd4bf; --bg-img:url("../../assets/backgrounds/cyber.png"); }
  :root[data-theme="forest"]  { --bg1:#14241a; --bg2:#07120c; --accent:#84cc16; --bg-img:url("../../assets/backgrounds/forest.png"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root[data-text-size="small"] { --text-scale: .92; }
  :root[data-text-size="large"] { --text-scale: 1.14; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid #facc15; outline-offset: 2px;
  }
  html { height: 100%; }
  body {
    font-family: "Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    background: radial-gradient(ellipse at top,var(--bg1),var(--bg2));
    color: var(--ink); height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background-image: var(--bg-img, none); background-size: cover; background-position: center;
    opacity: .5; filter: saturate(1.1);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 50% at 25% 25%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(45% 55% at 75% 75%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.6));
    animation: ambientDrift 20s ease-in-out infinite alternate;
  }
  @keyframes ambientDrift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(2%,-2%) scale(1.06)} }
  header { padding: 6px 8px; font-size: 18px; font-weight: 800; letter-spacing: 2px; flex-shrink: 0;
    color: var(--accent); text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 50%, transparent); }
  /* app-shell 頂列：金幣＋前往對戰同一列，頁面本身不捲動 */
  .pack-topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap; padding: 0 10px 6px; max-width: 100vw; }
  .coin-bar { font-size: 13px; font-weight: 700; color: #facc15; padding: 4px 14px; border-radius: 20px;
    background: rgba(250,204,21,.1); border: 1px solid rgba(250,204,21,.25); margin-bottom: 0; }
  .coin-bar span { font-size: 15px; font-weight: 900; }
  /* app-shell 主格線：所有區段同屏可見、各自垂直內捲 */
  .pack-main {
    flex: 1 1 auto; min-height: 0; width: min(100%, clamp(1180px, 94vw, 1720px));
    display: grid; gap: 8px; padding: 0 10px 8px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1.25fr);
    grid-template-areas: "goal open record" "deck deck collection";
  }
  .open-panel { grid-area: open; display: flex; flex-direction: column; align-items: center; }
  .goal-panel { grid-area: goal; }
  .record-panel { grid-area: record; }
  .deck-builder { grid-area: deck; display: flex; flex-direction: column; }
  .collection { grid-area: collection; }
  .open-panel, .goal-panel, .record-panel, .deck-builder, .collection {
    min-height: 0; max-height: 100%; overflow-y: auto; width: auto; margin: 0;
    background: rgba(13,17,23,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
  }
  @media (max-width: 1179px) and (min-width: 701px) {
    .pack-main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "open deck" "goal record" "collection collection";
    }
  }

  /* 卡包 */
  .pack-stage { min-height: 0; flex-shrink: 0; width: 100%; padding: 12px; position:relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .pack {
    width: 180px; height: 250px; border-radius: 18px; cursor: pointer;
    background: linear-gradient(160deg,#7c3aed,#4c1d95); border: 3px solid #a855f7;
    box-shadow: 0 0 36px rgba(168,85,247,.6), inset 0 0 30px rgba(0,0,0,.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; position: relative; transition: transform .2s; animation: floaty 3s ease-in-out infinite; overflow: hidden;
  }
  .pack::before { content:""; position:absolute; inset:0; background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
    background-size:250% 250%; animation: foilShine 3s linear infinite; }
  .pack::after { content:""; position:absolute; inset:7%; opacity:0; pointer-events:none;
    background:linear-gradient(118deg,transparent 47%,rgba(255,255,255,.95) 48% 50%,transparent 51%),linear-gradient(66deg,transparent 49%,rgba(253,224,71,.88) 50% 52%,transparent 53%); filter:drop-shadow(0 0 8px #fde047); }
  .pack:hover { transform: scale(1.06) rotate(-2deg); }
  .pack.opening { animation: packBurst .6s ease forwards; }
  .pack.opening::after { animation:packCrack .48s ease-out; }
  .pack .pack-icon { font-size: 64px; filter: drop-shadow(0 0 12px gold); z-index:1; }
  .pack .pack-label { font-weight: 800; font-size: 18px; z-index:1; }
  .pack .pack-hint { font-size: 12px; color: rgba(255,255,255,.75); z-index:1; }

  .reveal-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 18px; min-height: var(--card-h);
    perspective: 1200px; } /* 3D 透視讓翻牌立體（CP1-13）*/
  .reveal-skip { display:none; min-height:44px; margin:0 auto 8px; }
  .reveal-skip.show { display:block; }
  /* 壓軸卡額外光效（CP1-13）*/
  .card.finale { animation: flipIn .6s ease forwards, finalePulse 1.6s ease .6s 1 !important; z-index: 5; }
  @keyframes finalePulse { 0%,100%{transform:scale(1)} 30%{transform:scale(1.14); box-shadow:0 0 40px var(--glow,gold),0 0 80px var(--glow,gold)} }
  /* 開傳說/閃卡：全螢幕金色 vignette flash（CP1-13）*/
  .legend-flash { position: fixed; inset: 0; pointer-events: none; z-index: 200;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(245,158,11,.55) 100%);
    animation: legendFlashAnim .9s ease-out forwards; }
  @keyframes legendFlashAnim { 0%{opacity:0} 25%{opacity:1} 100%{opacity:0} }
  .pack-burst-flash { position:fixed; inset:-12vmax; z-index:190; pointer-events:none; opacity:0; transform:scale(.25);
    background:radial-gradient(circle,rgba(255,255,255,.98) 0 2%,rgba(253,224,71,.8) 5%,rgba(168,85,247,.5) 15%,transparent 38%),repeating-conic-gradient(from 10deg,rgba(255,255,255,.3) 0 2deg,transparent 2deg 15deg);
    mix-blend-mode:screen; animation:packLightBurst .68s cubic-bezier(.12,.76,.22,1); }

  .card {
    width: var(--card-w); height: var(--card-h); border-radius: 12px;
    background:linear-gradient(160deg,#273446,#141c28) padding-box,linear-gradient(135deg,#dce3e8,#697786 48%,#eef2f5 52%,#56616c) border-box; border:3px solid transparent;
    box-shadow: 0 0 18px var(--glow,transparent), 0 6px 16px rgba(0,0,0,.5);
    position: relative; display: flex; flex-direction: column; padding: 8px;
    transform-style: preserve-3d; opacity: 0;
  }
  .card.rarity-common { background:linear-gradient(160deg,#263343,#151d28) padding-box,repeating-linear-gradient(105deg,#d7dde2 0 2px,#697583 2px 5px,#aab3bc 5px 7px) border-box; }
  .card.rarity-rare { background:linear-gradient(160deg,#223148,#111b2d) padding-box,linear-gradient(135deg,#bfdbfe,#2563eb 35%,#60a5fa 58%,#172554) border-box; }
  .card.rarity-epic { background:linear-gradient(160deg,#30243e,#181425) padding-box,repeating-conic-gradient(from 35deg,#e9d5ff 0 7deg,#7e22ce 7deg 15deg,#c084fc 15deg 22deg,#4c1d95 22deg 30deg) border-box; }
  .card.rarity-legendary { background:linear-gradient(160deg,#342c1e,#1e170d) padding-box,linear-gradient(115deg,#78350f,#fde68a,#d97706,#fff7c2,#92400e,#fbbf24) border-box; }
  .card .frame-sheen { position:absolute; inset:-3px; border:3px solid transparent; border-radius:12px; pointer-events:none; z-index:6; opacity:0; }
  .card.rarity-legendary .frame-sheen { opacity:1; background:linear-gradient(115deg,#78350f,#fde68a,#d97706,#fff7c2,#92400e,#fbbf24) border-box; background-size:240% 240%; -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0); mask-composite:exclude; animation:legendFrameSweep 3.2s linear infinite; }
  .card.suspense { opacity:1; transform:translateY(-7px) scale(.88); filter:brightness(0) saturate(0); box-shadow:0 0 24px var(--glow),0 14px 24px rgba(0,0,0,.72); }
  .card.suspense::before { content:"?"; position:absolute; inset:0; z-index:12; display:grid; place-items:center; color:rgba(255,255,255,.65); font-size:56px; font-weight:950; filter:drop-shadow(0 0 8px var(--glow)); }
  .card.flip-in { animation: flipIn .72s cubic-bezier(.18,.9,.24,1.18) forwards; }
  .card.rare-pull   { animation: flipIn .72s cubic-bezier(.18,.9,.24,1.18) forwards, rarityShine 1.15s ease .45s 1, rareFlash .38s ease .48s 1; }
  .card.legend-pull { animation: flipIn .78s cubic-bezier(.18,.9,.24,1.18) forwards, legendShine 1.8s ease .48s 1, rareFlash .46s ease .42s 1; }
  /* 稀有度後方光柱 */
  .card .beam { position:absolute; inset:0; border-radius:12px; pointer-events:none; opacity:0; }
  .card .tide-wave { position:absolute; inset:-16%; border-radius:14px; pointer-events:none; opacity:0; z-index:4;
    background:linear-gradient(105deg,transparent 18%,rgba(125,211,252,0) 30%,rgba(224,242,254,.92) 45%,rgba(56,189,248,.72) 51%,rgba(14,165,233,0) 66%,transparent 78%),repeating-linear-gradient(165deg,transparent 0 8px,rgba(186,230,253,.2) 9px 11px,transparent 12px 22px);
    mix-blend-mode:screen; filter:drop-shadow(0 0 8px #38bdf8); transform:translateX(-125%) rotate(8deg); }
  .card.tide-pull .tide-wave { animation:tideSweep 1.28s cubic-bezier(.18,.72,.2,1) .48s 1; }
  .card.legend-pull .beam, .card.rare-pull .beam { animation: beamFlash 1.4s ease .4s; }
  .card .beam::after { content:""; position:absolute; left:50%; top:-40%; width:60%; height:180%; transform:translateX(-50%) rotate(8deg);
    background: linear-gradient(180deg, var(--glow), transparent); filter:blur(8px); }

  .card .art { flex:1; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:52px;
    background:radial-gradient(circle at 48% 38%,rgba(255,255,255,.17),transparent 28%),repeating-linear-gradient(125deg,transparent 0 10px,rgba(255,255,255,.045) 10px 12px),linear-gradient(145deg,var(--faction-hi,#526273),var(--faction-lo,#101722)); overflow:hidden; box-shadow:inset 0 2px 7px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.09); }
  .card.faction-neutral { --faction-accent:#94a3b8; --faction-mark:"◇"; }
  .card.faction-wardens { --faction-hi:#315f91; --faction-lo:#0b2039; --faction-accent:#93c5fd; --faction-mark:"⚜"; }
  .card.faction-conclave { --faction-hi:#684094; --faction-lo:#20102f; --faction-accent:#d8b4fe; --faction-mark:"✦"; }
  .card.faction-wild { --faction-hi:#9a4e1b; --faction-lo:#2d1609; --faction-accent:#fdba74; --faction-mark:"◆"; }
  .card.faction-wintershadow { --faction-hi:#31577c; --faction-lo:#0c1328; --faction-accent:#bae6fd; --faction-mark:"❄"; }
  .card.faction-conclave .art { background:radial-gradient(circle at 50% 48%,transparent 0 19%,rgba(216,180,254,.24) 20% 22%,transparent 23% 35%,rgba(168,85,247,.2) 36% 38%,transparent 39%),repeating-conic-gradient(from 20deg,rgba(255,255,255,.05) 0 8deg,transparent 8deg 24deg),linear-gradient(145deg,var(--faction-hi),var(--faction-lo)); }
  .card.faction-wild .art { background:repeating-linear-gradient(118deg,transparent 0 16px,rgba(254,215,170,.13) 16px 19px,transparent 19px 27px),radial-gradient(circle at 70% 25%,rgba(251,146,60,.3),transparent 32%),linear-gradient(145deg,var(--faction-hi),var(--faction-lo)); }
  .card.faction-wardens .art { background:linear-gradient(30deg,transparent 46%,rgba(191,219,254,.12) 47% 50%,transparent 51%),repeating-linear-gradient(135deg,transparent 0 14px,rgba(147,197,253,.08) 14px 16px),linear-gradient(145deg,var(--faction-hi),var(--faction-lo)); }
  .card.faction-wintershadow .art { background:radial-gradient(ellipse at 50% 115%,rgba(147,197,253,.2),transparent 46%),repeating-linear-gradient(155deg,transparent 0 13px,rgba(224,242,254,.11) 14px 15px,transparent 16px 27px),linear-gradient(32deg,transparent 44%,rgba(165,180,252,.12) 45% 48%,transparent 49%),linear-gradient(145deg,var(--faction-hi),var(--faction-lo)); }
  .card .art.art-fallback { position:relative; isolation:isolate; color:#fff; box-shadow:inset 0 2px 8px rgba(0,0,0,.78),inset 0 0 0 1px color-mix(in srgb,var(--faction-accent,#94a3b8) 34%,transparent),0 0 12px color-mix(in srgb,var(--faction-accent,#94a3b8) 18%,transparent); }
  .card .art.art-fallback::before { content:var(--faction-mark,"◇"); position:absolute; right:-8px; bottom:-22px; z-index:-1; color:var(--faction-accent,#94a3b8); font:900 78px/1 Georgia,serif; opacity:.14; transform:rotate(-12deg); text-shadow:0 0 18px currentColor; }
  .card .art.art-fallback::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--faction-accent,#94a3b8) 25%,transparent),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.07),transparent 38%,rgba(0,0,0,.28)); }
  .card .art-fallback .art-glyph { display:grid; place-items:center; width:62%; aspect-ratio:1; border:1px solid color-mix(in srgb,var(--faction-accent,#94a3b8) 58%,transparent); border-radius:50%; background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.2),rgba(7,12,20,.5) 66%); box-shadow:0 7px 15px rgba(0,0,0,.42),inset 0 0 13px color-mix(in srgb,var(--faction-accent,#94a3b8) 24%,transparent); text-shadow:0 3px 8px rgba(0,0,0,.72); }
  .card .art img { width:100%; height:100%; object-fit:cover; }
  .card .cost { position:absolute; top:-10px; left:-10px; width:32px; height:34px; clip-path:polygon(50% 0,88% 18%,100% 62%,50% 100%,0 62%,12% 18%);
    background:radial-gradient(circle at 34% 24%,#dbeafe 0 7%,#60a5fa 18%,#2563eb 56%,#0b2f71 100%); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:950; z-index:8; filter:drop-shadow(0 3px 3px rgba(0,0,0,.7)) drop-shadow(0 0 4px #2563eb); text-shadow:0 1px 2px #071b40; }
  .card .stars { position:absolute; top:-9px; right:6px; font-size:11px; color:var(--rarity); text-shadow:0 0 5px var(--glow); z-index:3; }
  .card .cardname { font-size:13px; font-weight:800; text-align:center; margin-top:4px; }
  .card .rarity-tag { font-size:10px; text-align:center; color:var(--rarity); font-weight:700; letter-spacing:1px; }
  .card .kwrow { display:flex; gap:3px; justify-content:center; min-height:14px; }
  .card .kw { font-size:12px; }
  .card .stats { display:flex; justify-content:space-between; margin-top:2px; }
  .card .atk,.card .hp { width:26px; height:26px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; box-shadow:0 3px 5px rgba(0,0,0,.58),inset 0 2px 2px rgba(255,255,255,.45),inset 0 -3px 5px rgba(0,0,0,.32); text-shadow:0 1px 2px rgba(0,0,0,.8); }
  .card .atk { border-radius:32% 68% 38% 62%; transform:rotate(-4deg); background:radial-gradient(circle at 34% 24%,#fff4bd 0 6%,#fbbf24 22%,#d97706 62%,#713f12); } .card .hp { border-radius:50% 50% 58% 58% / 45% 45% 70% 70%; background:radial-gradient(circle at 34% 24%,#fecaca 0 7%,#f87171 24%,#dc2626 62%,#7f1d1d); }
  .card.spell .stats, .card.spell .kwrow { display:none; }
  /* 閃卡 */
  .card.foil { border-width:4px; box-shadow:0 0 26px gold, 0 6px 16px rgba(0,0,0,.5); }
  .card.foil::after { content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none;
    background:linear-gradient(118deg,transparent 18%,rgba(103,232,249,.22) 33%,rgba(255,255,255,.56) 43%,rgba(251,113,133,.25) 50%,rgba(196,181,253,.28) 57%,transparent 73%),linear-gradient(62deg,transparent 24%,rgba(250,204,21,.15) 38%,rgba(52,211,153,.18) 49%,rgba(96,165,250,.2) 61%,transparent 76%);
    background-size:280% 280%,230% 230%; opacity:.82; animation:foilShine 2.8s linear infinite; mix-blend-mode:screen; }
  .card .foil-tag { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800;
    color:#1a1206; background:linear-gradient(90deg,#fde047,#f59e0b); padding:1px 8px; border-radius:8px; z-index:3; }
  .card.tide { border-color:#38bdf8; box-shadow:0 0 24px rgba(56,189,248,.72),0 6px 16px rgba(0,0,0,.5); }
  .card.tide::before { content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(135deg,rgba(125,211,252,0) 0 9px,rgba(125,211,252,.26) 10px 12px,rgba(14,165,233,0) 13px 22px);
    mix-blend-mode:screen; }
  .card .tide-tag { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:800;
    color:#062133; background:linear-gradient(90deg,#7dd3fc,#38bdf8); padding:1px 8px; border-radius:8px; z-index:3; }
  /* 重複標記 */
  .card .dup-tag { position:absolute; top:8px; right:6px; font-size:10px; font-weight:800; color:#fff;
    background:rgba(0,0,0,.6); padding:1px 6px; border-radius:8px; z-index:3; }
  .card .new-card-tag { position:absolute; top:8px; right:6px; font-size:10px; font-weight:900; color:#052e16;
    background:linear-gradient(180deg,#86efac,#22c55e); padding:1px 6px; border-radius:8px; z-index:3; }

  .actions { display:flex; gap:12px; padding:12px; flex-wrap:wrap; justify-content:center; flex-shrink:0; }
  .reveal-row { flex-shrink: 0; }
  button { background:linear-gradient(180deg,var(--accent),#d97706); color:#1a1206; border:none; padding:12px 24px;
    border-radius:24px; font-size:15px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent); transition:transform .1s; }
  button:hover { transform:scale(1.05); }
  button.ghost { background:#2a3645; color:var(--ink); box-shadow:none; }
  button:disabled { filter:grayscale(1) brightness(.65); cursor:not-allowed; transform:none; }
  .audio-toggle-btn { min-width:42px; padding-inline:10px; border-radius:999px; }

  /* 收藏冊 */

  .filter-panel { min-width:0; border:1px solid rgba(255,255,255,.1); border-radius:8px; background:rgba(8,12,18,.42); }

  .filter-line-label { color:var(--muted); font-size:12px; font-weight:900; }
  .filter-chip-row { display:flex; gap:6px; overflow-x:auto; padding:1px 0 4px; scrollbar-width:thin; }
  .filter-chip {
    flex:0 0 auto; min-height:32px; border:1px solid rgba(255,255,255,.13); border-radius:999px;
    padding:6px 10px; background:rgba(255,255,255,.05); color:var(--ink);
    font-size:12px; font-weight:900; box-shadow:none; cursor:pointer; white-space:nowrap;
  }
  .filter-chip:hover { transform:none; }
  .filter-chip.active { background:linear-gradient(180deg,#facc15,#d97706); color:#1a1206; border-color:rgba(250,204,21,.7); }
  .collection .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; }
  .slot { aspect-ratio:5/7; border-radius:8px; border:2px solid #2a3645; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:24px; background:#131a24; position:relative; overflow:hidden; }
  .slot.owned { border-color:var(--rarity); box-shadow:0 0 8px var(--glow); }
  .slot.foil { border-color:gold; box-shadow:0 0 12px gold; }
  .slot.tide { border-color:#38bdf8; box-shadow:0 0 12px rgba(56,189,248,.82); }
  .slot.tide::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(135deg,rgba(125,211,252,0) 0 8px,rgba(125,211,252,.22) 9px 11px,rgba(14,165,233,0) 12px 20px); mix-blend-mode:screen; }
  .slot.locked { filter:grayscale(1) brightness(.4); }
  .slot img { width:34px; height:34px; object-fit:cover; border-radius:4px; }
  .slot .count { position:absolute; bottom:2px; right:4px; font-size:10px; color:var(--accent); font-weight:800; }
  .slot .nm { font-size:8px; color:var(--muted); }
  /* 重複卡分解按鈕（CP2-7）——bottom:0 必須留在格子內，slot 有 overflow:hidden，
     負值會被裁掉一半，觸控裝置上只剩不到 10px 可點 */
  .slot .dismantle-btn { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; padding:6px; min-height:44px; min-width:44px; border-radius:8px 8px 0 0; white-space:nowrap;
    background:#facc15; color:#3a2a06; border:none; cursor:pointer; opacity:0; transition:opacity .15s; z-index:4; }
  .slot:hover .dismantle-btn { opacity:1; }
  @media (hover:none) { .slot .dismantle-btn { opacity:1; } } /* 觸控裝置常駐顯示 */
  .slot .fstar { position:absolute; top:2px; right:3px; font-size:9px; color:gold; }
  .slot .tide-mark { color:#7dd3fc; }

  .deck-builder { padding:12px; }

    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); grid-template-rows:minmax(0,1fr); gap:12px; align-items:stretch; }
  .deck-panel { background:rgba(13,17,23,.55); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:12px;

  .curve-bar { width:100%; min-height:4px; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,#facc15,#d97706); box-shadow:0 0 8px rgba(250,204,21,.24); }

  .goal-panel { padding:12px; }
  .goal-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }

  .goal-summary { font-size:12px; color:var(--muted); }

  .milestone-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:7px; }
  .goal-item { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px; background:rgba(255,255,255,.04); min-width:0; }
  .goal-title { font-size:12px; font-weight:900; color:#facc15; margin-bottom:3px; }
  .goal-progress { font-size:11px; color:var(--muted); margin-bottom:7px; }

  .weekly-goal .goal-title { color:#5eead4; }
  .record-panel { padding:12px; }

  .record-head button { padding:7px 10px; border-radius:8px; font-size:12px; }

  .pwa-save-tools { margin-top: 8px; }
  .record-tools select { background:rgba(15,23,42,.9); color:var(--ink); border:1px solid rgba(255,255,255,.14);
    border-radius:8px; padding:7px 9px; font-size:12px; font-weight:800; }
  .version-pill { border:1px solid rgba(250,204,21,.28); border-radius:999px; padding:6px 9px; color:#facc15; font-size:12px; font-weight:900; background:rgba(250,204,21,.08); }
  .save-manager { margin-top:10px; display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; }
  .save-manager textarea { min-height:38px; max-height:90px; resize:vertical; border-radius:8px; padding:8px;
    background:rgba(15,23,42,.92); color:var(--ink); border:1px solid rgba(255,255,255,.14);
    font:12px/1.4 ui-monospace, Consolas, monospace; }
  .record-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; }
  .record-card { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:8px; background:rgba(255,255,255,.04); }
  .record-title { font-size:12px; color:#facc15; font-weight:900; margin-bottom:5px; }
  .record-value { font-size:12px; color:var(--muted); line-height:1.55; white-space:pre-line; }
  .card .cardname, .deck-name { font-size: calc(13px * var(--text-scale)); }
  .record-value, .goal-progress, .mission-progress, .deck-meta, .deck-errors, .deck-save-msg { font-size: calc(12px * var(--text-scale)); }
  .mission-name, .goal-title, .record-title { font-size: calc(12px * var(--text-scale)); }
  .mission-drawer-btn { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; z-index: 90; background: #1a2230;
    color: #e6edf3; border: 1px solid rgba(255,255,255,.15); padding: 8px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mission-badge { position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:999px;
    background:#ef4444; color:#fff; display:none; align-items:center; justify-content:center; font-size:11px; padding:0 5px; }
  .mission-badge.show { display:flex; }
  .mission-drawer { position:fixed; inset:0; z-index:135; display:none; align-items:flex-end; justify-content:center;

  }
  @media (max-height: 760px) {
    header { padding: 3px 8px; font-size: 15px; }

  }

  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes foilShine { 0%{background-position:0% 0%,230% 0%;opacity:.62} 48%{opacity:.9} 100%{background-position:280% 280%,0% 230%;opacity:.66} }
  @keyframes packBurst { 0%{transform:scale(1) rotate(0);opacity:1} 38%{transform:scale(.92) rotate(-3deg);opacity:1} 72%{transform:scale(1.34) rotate(4deg);opacity:.94} 100%{transform:scale(1.58) rotate(0);opacity:0} }
  @keyframes packCrack { 0%{opacity:0;transform:scaleY(.2)} 35%{opacity:1;transform:scaleY(1)} 100%{opacity:0;transform:scale(1.25)} }
  @keyframes packLightBurst { 0%{opacity:0;transform:scale(.25) rotate(-8deg)} 26%{opacity:1} 100%{opacity:0;transform:scale(1.12) rotate(4deg)} }
  @keyframes legendFrameSweep { 0%{background-position:0% 50%} 100%{background-position:240% 50%} }
  @keyframes flipIn { 0%{transform:rotateY(104deg) translateY(12px) scale(.62);opacity:0} 54%{transform:rotateY(-13deg) translateY(-5px) scale(1.08);opacity:1} 100%{transform:rotateY(0) translateY(0) scale(1);opacity:1} }
  @keyframes rarityShine { 0%,100%{box-shadow:0 0 18px var(--glow),0 6px 16px rgba(0,0,0,.5)} 50%{box-shadow:0 0 34px var(--glow),0 0 60px var(--glow)} }
  @keyframes legendShine { 0%,100%{box-shadow:0 0 18px var(--glow),0 6px 16px rgba(0,0,0,.5)} 50%{box-shadow:0 0 50px gold,0 0 90px rgba(245,158,11,.7)} }
  @keyframes beamFlash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
  @keyframes rareFlash { 0%{filter:brightness(1)} 45%{filter:brightness(2.2) saturate(1.7)} 100%{filter:brightness(1)} }
  @keyframes tideSweep { 0%{opacity:0;transform:translateX(-125%) rotate(8deg)} 22%,58%{opacity:1} 100%{opacity:0;transform:translateX(125%) rotate(8deg)} }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:0ms !important; scroll-behavior:auto !important;
    }
    .card { opacity:1; }
    .card.flip-in, .card.rare-pull, .card.legend-pull, .card.finale,
    .pack, .pack::before, body::after { animation:none !important; }
    .legend-flash, .pack-burst-flash, .card .beam, .card .tide-wave { display:none !important; }
    .card.rarity-legendary .frame-sheen, .card.foil::after { animation:none !important; }
  }
  :root[data-perf="low"] .pack, :root[data-perf="low"] .pack::before,
  :root[data-perf="low"] body::after { animation:none; }
  :root[data-perf="low"] .card .beam, :root[data-perf="low"] .card .tide-wave,
  :root[data-perf="low"] .pack-burst-flash { display:none; }
  :root[data-perf="low"] .card.rarity-legendary .frame-sheen,
  :root[data-perf="low"] .card.foil::after { animation:none; }
  /* 海報幀：停在可讀峰值；低效能與 reduced-motion 仍是純靜態。 */
  body.reveal-freeze *, body.reveal-freeze *::before, body.reveal-freeze *::after { animation:none !important; transition:none !important; }
  body.reveal-freeze .card { opacity:1; }
  body.reveal-freeze .card.rarity-legendary .frame-sheen { background-position:58% 50%; }
  body.reveal-freeze .card.foil::after { background-position:46% 42%,62% 54%; opacity:.88; }
  body.reveal-freeze[data-reveal-freeze="legendPeak"] .card { transform:translateY(0) scale(1); filter:none; }
  body.reveal-freeze[data-reveal-freeze="legendPeak"] .card.legend-pull .beam { display:block !important; opacity:.86; }
  body.reveal-freeze[data-reveal-freeze="legendPeak"] .card.rarity-legendary { box-shadow:0 0 50px gold,0 0 86px rgba(245,158,11,.62); }
  body.reveal-freeze[data-reveal-freeze="foilPeak"] .card { transform:translateY(0) scale(1); filter:none; }
  body.reveal-freeze[data-reveal-freeze="foilPeak"] .card.foil { box-shadow:0 0 40px #67e8f9,0 0 72px rgba(196,181,253,.52); }
</style>

<body>

    </div>
    <div class="record-grid" id="recordGrid"></div>

      <section class="mission-section">

                <button class="filter-chip" type="button" data-value="common">普通</button>
                <button class="filter-chip" type="button" data-value="rare">稀有</button>

          </div>

  <script>
    (() => {
      const mq = window.matchMedia("(max-width: 360px), (max-height: 400px)");
      const applyCompactFilters = () => {
        const panel = document.querySelector("#collectionTools .filter-panel");
        if (!panel) return;
        if (mq.matches) {
          panel.removeAttribute("open");
          panel.dataset.compactDefault = "1";
        } else if (panel.dataset.compactDefault === "1") {
          panel.setAttribute("open", "");
          delete panel.dataset.compactDefault;
        }
      };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", applyCompactFilters, { once: true });
      else applyCompactFilters();
      if (mq.addEventListener) mq.addEventListener("change", applyCompactFilters);
      else mq.addListener(applyCompactFilters);
    })();
  </script>

  <script>
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "setTheme") document.documentElement.setAttribute("data-theme", e.data.theme);
    });
    try { const t = localStorage.getItem("cardgame_theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
  </script>
