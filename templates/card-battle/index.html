<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>卡牌對戰 · Card Battle</title>
<script>
  (() => {
    const CACHE_VERSION = "card-battle-r62-v1";
    const SW_AUTO_RELOAD_WINDOW_MS = 15000;
    const SW_AUTO_RELOAD_KEY = "card_sw_auto_reload_r62_v1";
    const swPageLoadedAt = Date.now();
    window.__CARD_CACHE_VERSION = CACHE_VERSION;
    window.__CARD_SW_BOOT = { CACHE_VERSION, SW_AUTO_RELOAD_WINDOW_MS, SW_AUTO_RELOAD_KEY, swPageLoadedAt };
    if (!("serviceWorker" in navigator) || window.__cardSwBootGuardInstalled) return;
    window.__cardSwBootGuardInstalled = true;
    const hasReloaded = () => { try { return sessionStorage.getItem(SW_AUTO_RELOAD_KEY) === "1"; } catch { return true; } };
    const markReloaded = () => { try { sessionStorage.setItem(SW_AUTO_RELOAD_KEY, "1"); } catch {} };
    const shouldReload = (now) => (Number(now || Date.now()) - swPageLoadedAt) <= SW_AUTO_RELOAD_WINDOW_MS && !hasReloaded();
    const notify = () => {
      window.__cardSwUpdatePending = true;
      try { window.dispatchEvent(new CustomEvent("card-sw-update-available")); } catch {}
      if (typeof window.__cardSwUpdatePrompt === "function") window.__cardSwUpdatePrompt();
    };
    window.__CARD_SW_BOOT.shouldAutoReloadForSwUpdate = shouldReload;
    // 首次安裝（載入時尚無 controller）取得控制權不是「更新」，不自動重載；
    // 只有原本就受控、被新 SW 接管時才走 15 秒視窗內的一次性自動重載。
    const wasControlledAtBoot = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (window.__cardSwBootReloading) return;
      if (!wasControlledAtBoot) return;
      if (shouldReload()) {
        window.__cardSwBootReloading = true;
        markReloaded();
        location.reload();
        return;
      }
      notify();
    });
    navigator.serviceWorker.getRegistration(new URL("../../", location.href).toString())
      .then((registration) => { if (registration) return registration.update(); })
      .catch(() => {});
  })();
</script>
<style>
  /* ===== 主題變數（由入口頁注入 data-theme 覆寫）===== */
  :root {
    --bg1: #16202e; --bg2: #0f1419;
    --panel: #1a2230; --panel-border: #2a3645;
    --ink: #e6edf3; --muted: #8b98a8;
    --mana: #3b82f6; --hp: #ef4444; --accent: #f59e0b;
    --card-w: clamp(124px, 7.2vw, 152px); --card-h: calc(var(--card-w) * 1.42); --text-scale: 1;
    --bg-img: url("../../assets/backgrounds/dark.png");
  }
  :root[data-theme="fantasy"] {
    --bg1: #2a1d10; --bg2: #160d05;
    --panel: #251a0f; --panel-border: #4a361c;
    --accent: #f0a830; --mana: #2f80ed;
    --bg-img: url("../../assets/backgrounds/fantasy.png");
  }
  :root[data-theme="cyber"] {
    --bg1: #0a1626; --bg2: #04070f;
    --panel: #0d1b2e; --panel-border: #1b3a5c;
    --accent: #2dd4bf; --mana: #38bdf8; --hp: #f43f5e;
    --bg-img: url("../../assets/backgrounds/cyber.png");
  }
  :root[data-theme="forest"] {
    --bg1: #14241a; --bg2: #07120c;
    --panel: #122019; --panel-border: #234a32;
    --accent: #84cc16; --mana: #22c55e;
    --bg-img: url("../../assets/backgrounds/forest.png");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg1), var(--bg2));
    color: var(--ink); height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; overflow: hidden; position: relative;
    --opponent-tone: #3b82f6;
    --opponent-tone-soft: rgba(59,130,246,.2);
  }
  body[data-opponent="op_magister_vey"] { --opponent-tone:#a855f7; --opponent-tone-soft:rgba(168,85,247,.22); }
  body[data-opponent="op_scarra"] { --opponent-tone:#f97316; --opponent-tone-soft:rgba(249,115,22,.23); }
  /* 背景圖層（依主題切換，--bg-img 由各主題設定）*/
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background-image: var(--bg-img, none);
    background-size: cover; background-position: center;
    opacity: .55; filter: saturate(1.1);
  }
  /* 動態氛圍層：兩團緩慢飄移的光暈 + 暗角 */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 50% at 20% 30%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      radial-gradient(42% 52% at 78% 24%, var(--opponent-tone-soft), transparent 72%),
      radial-gradient(45% 55% at 80% 70%, color-mix(in srgb, var(--opponent-tone) 16%, transparent), transparent 70%),
      radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.6));
    animation: ambientDrift 18s ease-in-out infinite alternate;
  }
  @keyframes ambientDrift {
    0%   { transform: translate(0, 0) scale(1); opacity: .9; }
    100% { transform: translate(-2%, 2%) scale(1.06); opacity: 1; }
  }
  header {
    width: 100%; text-align: center; padding: 8px; font-weight: 700; flex-shrink: 0;
    letter-spacing: 2px; color: var(--accent);
    text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 50%, transparent);
  }

  /* app-shell：頁面本身不捲動，區域各自內捲 */
  .board { width: clamp(980px, 92vw, 1600px); flex: 1; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 7px; padding: 7px; }
  .board.shake-screen { animation: screenShake .26s; }
  .board.lethal-slow { animation: lethalSlow .62s cubic-bezier(.12,.8,.18,1); filter: saturate(1.35) contrast(1.08); }
  body.defeat-fade .board { animation: defeatFade .7s ease forwards; }

  .hero-row {
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    position:relative; overflow:hidden;
    background:
      linear-gradient(105deg,rgba(255,255,255,.07),transparent 34%),
      radial-gradient(circle at 12% 50%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 34%),
      color-mix(in srgb, var(--panel) 88%, transparent);
    border-radius: 12px; padding: 8px 16px;
    border: 1px solid color-mix(in srgb,var(--accent) 24%,var(--panel-border));
    backdrop-filter: blur(4px);
    box-shadow:0 5px 16px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -10px 24px rgba(0,0,0,.16);
  }
  .hero { display: flex; align-items: center; gap: 10px; cursor: pointer; transition: transform .15s; }
  .player-hero-scene { display:flex; align-items:center; gap:8px; min-width:0; }
  .scene-hint-btn {
    width:38px; height:38px; flex:0 0 38px; border-radius:50%; border:1px solid rgba(250,204,21,.44);
    display:grid; place-items:center; background:rgba(250,204,21,.12); color:#fef3c7;
    font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 0 14px rgba(250,204,21,.22), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .scene-hint-btn:disabled { filter:grayscale(1) brightness(.62); cursor:not-allowed; box-shadow:none; }
  .hero.targetable { animation: pulseTarget 1s infinite; cursor: crosshair; }
  .hero .avatar {
    width:44px; height:44px; flex:0 0 44px; display:grid; place-items:center; box-sizing:border-box;
    font-size:28px; line-height:1; border-radius:50%; border:2px solid rgba(255,255,255,.6);
    background:radial-gradient(circle at 32% 24%,#fef3c7 0 6%,#b45309 36%,#312e81 72%,#0f172a 100%);
    box-shadow:0 0 0 2px rgba(9,13,24,.88),0 0 15px color-mix(in srgb,var(--accent) 44%,transparent),inset 0 2px 4px rgba(255,255,255,.42),inset 0 -7px 10px rgba(0,0,0,.48);
    text-shadow:0 2px 3px rgba(0,0,0,.72);
  }
  #enemyHero .avatar { background:radial-gradient(circle at 32% 24%,#fff 0 4%,color-mix(in srgb,var(--opponent-tone) 82%,#94a3b8) 34%,#1e293b 73%,#090d18 100%); box-shadow:0 0 0 2px rgba(9,13,24,.88),0 0 15px color-mix(in srgb,var(--opponent-tone) 52%,transparent),inset 0 2px 4px rgba(255,255,255,.38),inset 0 -7px 10px rgba(0,0,0,.5); }
  .hero .name { font-weight: 600; }
  .hp-badge, .mana-badge {
    position:relative; isolation:isolate; overflow:hidden;
    display:inline-flex; align-items:center; justify-content:center; gap:5px; min-height:32px;
    color:#fff; font-weight:900; padding:4px 12px; border:1px solid rgba(255,255,255,.44);
    border-radius:13px 13px 16px 16px / 11px 11px 19px 19px; font-size:15px;
    text-shadow:0 1px 2px rgba(0,0,0,.9);
    box-shadow:0 4px 7px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.38),inset 0 -5px 8px rgba(0,0,0,.38);
  }
  .hp-badge::before, .mana-badge::before {
    content:""; position:absolute; z-index:-1; inset:1px 9% 50%; border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.48),rgba(255,255,255,0)); opacity:.72;
    pointer-events:none;
  }
  .hp-badge { background:radial-gradient(circle at 30% 18%,#fecaca 0 5%,#f87171 23%,#dc2626 61%,#6f101b 100%); }
  .mana-badge { background:radial-gradient(circle at 30% 18%,#dbeafe 0 5%,#60a5fa 23%,#2563eb 61%,#082d73 100%); }
  .hp-badge.critical { border-color:#fecaca; box-shadow:0 0 11px rgba(248,113,113,.72),0 4px 7px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.38),inset 0 -5px 8px rgba(0,0,0,.42); }

  .battlefield {
    /* flex-wrap：手機窄版面隨從多時換行，不然固定寬卡片會同時被左右裁切、點不到；
       桌機 app-shell：戰場 flex 自適應、超出高度時區內垂直捲動 */
    flex: 1 1 calc(var(--card-h) + 12px); min-height: 56px;
    max-height: calc(var(--card-h) * 2 + 26px); overflow-y: auto;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    align-items: center; align-items: safe center; align-content: center; align-content: safe center;
    padding: 6px; border-radius: 12px;
    /* 戰場棋盤質感：深色半透明 + 細格線紋理 + 內陰影，像放在真實戰場上 */
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 38px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 38px),
      linear-gradient(180deg, rgba(10,14,20,.55), rgba(10,14,20,.35));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--panel-border));
    box-shadow: inset 0 2px 16px rgba(0,0,0,.5), inset 0 0 30px color-mix(in srgb, var(--accent) 8%, transparent);
    backdrop-filter: blur(1px); transition: background .2s, box-shadow .2s;
  }
  .battlefield.enemy {
    background:
      radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--opponent-tone) 18%, transparent), transparent 62%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 38px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 38px),
      linear-gradient(180deg, color-mix(in srgb, var(--opponent-tone) 9%, rgba(10,14,20,.62)), rgba(10,14,20,.38));
    border-color: color-mix(in srgb, var(--opponent-tone) 52%, var(--panel-border));
    box-shadow: inset 0 2px 16px rgba(0,0,0,.5), inset 0 0 38px color-mix(in srgb, var(--opponent-tone) 16%, transparent), 0 0 18px color-mix(in srgb, var(--opponent-tone) 8%, transparent);
  }
  .battlefield .empty-hint { color: var(--muted); font-size: 13px; opacity: .7; }

  /* ===== 卡片 ===== */
  .card {
    width: var(--card-w); height: var(--card-h); border-radius: 10px;
    background: linear-gradient(160deg, #273446, #141c28) padding-box,
      linear-gradient(135deg, #dce3e8, #697786 48%, #eef2f5 52%, #56616c) border-box;
    border: 2px solid transparent;
    /* 稀有度色階：普通卡 glow-size:0 不發光，越稀有越亮（CP1-10）*/
    box-shadow: 0 0 var(--glow-size, 0) var(--glow, transparent), 0 4px 10px rgba(0,0,0,.45);
    position: relative; display: flex; flex-direction: column; padding: 5px;
    cursor: pointer; transition: transform .15s, box-shadow .2s; flex-shrink: 0;
  }
  /* 四階框材質：銀鋼、藍晶、紫紋、金箔。 */
  .card.rarity-common { background:linear-gradient(160deg,#263343,#151d28) padding-box,repeating-linear-gradient(105deg,#d7dde2 0 2px,#697583 2px 5px,#aab3bc 5px 7px) border-box; }
  .card.rarity-rare { border-width:3px; background:linear-gradient(160deg,#223148,#111b2d) padding-box,linear-gradient(135deg,#dbeafe,#1d4ed8 31%,#93c5fd 52%,#2563eb 69%,#172554) border-box; box-shadow:0 0 17px rgba(59,130,246,.58),0 5px 13px rgba(0,0,0,.5),inset 0 0 14px rgba(59,130,246,.08); }
  .card.rarity-epic { border-width:3px; background:linear-gradient(160deg,#30243e,#181425) padding-box,repeating-conic-gradient(from 35deg,#f3e8ff 0 8deg,#7e22ce 8deg 16deg,#d8b4fe 16deg 24deg,#4c1d95 24deg 32deg) border-box; box-shadow:0 0 21px rgba(168,85,247,.64),0 5px 13px rgba(0,0,0,.52),inset 0 0 18px rgba(192,132,252,.1); }
  .card.rarity-legendary { background:linear-gradient(160deg,#342c1e,#1e170d) padding-box,linear-gradient(115deg,#78350f,#fde68a,#d97706,#fff7c2,#92400e,#fbbf24) border-box; }
  .card .frame-sheen { position:absolute; inset:-3px; border:3px solid transparent; border-radius:12px; pointer-events:none; z-index:6; opacity:0; }
  .card.rarity-legendary .frame-sheen { opacity:1; background:linear-gradient(115deg,#78350f,#fde68a,#d97706,#fff7c2,#92400e,#fbbf24) border-box; background-size:240% 240%; -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0); mask-composite:exclude; animation:legendFrameSweep 3.2s linear infinite; }
  /* 傳說：常駐呼吸光 */
  .card.legend-idle { animation:legendIdle 2.2s ease-in-out infinite; }
  @keyframes legendIdle {
    0%,100% { box-shadow: 0 0 18px var(--glow), 0 4px 10px rgba(0,0,0,.45); }
    50% { box-shadow: 0 0 34px var(--glow), 0 0 50px var(--glow), 0 4px 10px rgba(0,0,0,.45); }
  }
  .card:hover { transform: translateY(-8px) scale(1.05); z-index: 5; }
  .card.playable { outline:2px solid var(--accent); outline-offset:1px; }
  .card.disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; }
  .card.can-attack { outline:2px solid #22c55e; outline-offset:1px; box-shadow:0 0 var(--glow-size,0) var(--glow,transparent),0 5px 13px rgba(0,0,0,.5),inset 0 0 0 2px rgba(34,197,94,.55); }
  .card.selected { outline: 3px solid var(--accent); transform: translateY(-8px) scale(1.05); z-index: 6; }
  .card.targetable { animation: pulseTarget 1s infinite; }
  .card.target-queued { outline:3px solid #facc15; box-shadow:0 0 18px rgba(250,204,21,.55),0 5px 13px rgba(0,0,0,.5); z-index:12; }
  .target-action-popover {
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    z-index:24; display:flex; gap:5px; padding:5px; border-radius:10px;
    background:rgba(8,12,18,.92); border:1px solid rgba(250,204,21,.38);
    box-shadow:0 8px 18px rgba(0,0,0,.44); pointer-events:auto;
  }
  .target-action-popover button {
    min-width:42px; min-height:30px; border:0; border-radius:8px; padding:5px 8px;
    font-size:12px; font-weight:900; cursor:pointer;
  }
  .target-action-popover .confirm { background:linear-gradient(180deg,#facc15,#eab308); color:#271a02; }
  .target-action-popover .cancel { background:#2a3645; color:var(--ink); }
  .card.blocked { filter: grayscale(.7) brightness(.6); }
  .card.spawn { animation: spawnIn .32s cubic-bezier(.2,1.15,.4,1); }
  .card.landing { animation:minionLand .54s cubic-bezier(.12,.82,.2,1.12); }
  .card .summon-impact { position:absolute; left:50%; bottom:-13px; width:118%; height:24px; border-radius:50%; pointer-events:none; z-index:-1; opacity:0; transform:translateX(-50%) scaleX(.2); background:radial-gradient(ellipse, color-mix(in srgb,var(--rarity) 55%,white), transparent 68%); }
  .card.landing .summon-impact { animation:summonImpact .54s ease-out; }
  .card.dying { animation: dieOut .52s ease forwards; pointer-events: none; overflow: hidden; }
  .card.dying::after {
    content: ""; position: absolute; inset: -12%; pointer-events: none; z-index: 8;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 7px, rgba(255,255,255,.34) 8px 10px, rgba(255,255,255,0) 11px 18px);
    mix-blend-mode: screen; animation: dissolveSweep .52s ease forwards;
  }
  .card.combat-ghost { pointer-events:none !important; z-index:180; }
  .card.combat-ghost .card-info-btn { display:none; }
  .card.attacking { animation: lunge .3s ease; }
  .card.lunge-to { animation: lungeTo .36s ease; z-index: 30; }
  .card.hit-shake { animation: hitShake .3s; }
  .card.damaged { animation: flashRed .4s; }
  .card.shield-break { animation: shieldBreak .4s; }
  .card.shield-gain { animation: shieldGain .5s; }
  .card.poisoned { animation: poisonHit .5s; }
  .card.regen { animation: regenPulse .6s; }

  /* 閃卡 foil */
  .card.foil { border-width: 3px; }
  .card.foil::after {
    content:""; position:absolute; inset:0; border-radius:10px; pointer-events:none; z-index:5;
    background:linear-gradient(118deg,transparent 18%,rgba(103,232,249,.2) 33%,rgba(255,255,255,.5) 43%,rgba(251,113,133,.22) 50%,rgba(196,181,253,.25) 57%,transparent 73%),linear-gradient(62deg,transparent 24%,rgba(250,204,21,.13) 38%,rgba(52,211,153,.16) 49%,rgba(96,165,250,.18) 61%,transparent 76%);
    background-size:280% 280%,230% 230%; opacity:.78; animation:foilShine 3.1s linear infinite; mix-blend-mode:screen;
  }
  .card.tide { border-color:#38bdf8; box-shadow:0 0 18px rgba(56,189,248,.65), 0 4px 10px rgba(0,0,0,.45); }
  .card.tide::before {
    content:""; position:absolute; inset:0; border-radius:10px; pointer-events:none; z-index:1;
    background:
      repeating-linear-gradient(135deg, rgba(125,211,252,.0) 0 9px, rgba(125,211,252,.22) 10px 12px, rgba(14,165,233,.0) 13px 22px),
      radial-gradient(circle at 70% 20%, rgba(56,189,248,.24), transparent 36%);
    mix-blend-mode:screen; opacity:.9;
  }

  .card .cost {
    position:absolute; top:-9px; left:-9px; width:30px; height:32px;
    clip-path:polygon(50% 0,88% 18%,100% 62%,50% 100%,0 62%,12% 18%);
    background:radial-gradient(circle at 34% 24%,#dbeafe 0 7%,#60a5fa 18%,#2563eb 56%,#0b2f71 100%); color:#fff;
    display: flex; align-items: center; justify-content: center;
    font-weight:950; font-size:15px; z-index:8;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.7)) drop-shadow(0 0 3px #2563eb);
    text-shadow:0 1px 2px #071b40;
  }
  .card-info-btn {
    position:absolute; top:22px; right:4px; z-index:20; width:34px; height:34px;
    border:1px solid rgba(255,255,255,.32); border-radius:50%; color:#fff; background:rgba(8,12,18,.82);
    font-size:13px; font-weight:900; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.45); touch-action:manipulation; pointer-events:auto;
  }
  @media (hover:hover) {
    .card-info-btn { opacity:.25; transition:opacity .15s, transform .15s; }
    .card:hover .card-info-btn { opacity:1; }
  }
  .card .stars { position: absolute; top: -7px; right: 4px; font-size: 9px; color: var(--rarity);
    text-shadow: 0 0 4px var(--glow); letter-spacing: -1px; z-index: 3; }
  .card .shield-ring {
    position: absolute; inset: -3px; border-radius: 12px; border: 2px solid #fde047;
    box-shadow: 0 0 12px #fde047, inset 0 0 8px #fde047; pointer-events: none; z-index: 2;
    animation: shieldPulse 1.6s ease-in-out infinite;
  }
  .card .taunt-crest {
    position:absolute; right:-9px; top:43%; width:28px; height:34px; z-index:7; pointer-events:none;
    display:flex; align-items:center; justify-content:center; color:#ecfeff; font-size:14px; font-weight:950;
    clip-path:polygon(50% 0,94% 14%,88% 72%,50% 100%,12% 72%,6% 14%);
    background:linear-gradient(145deg,#dbeafe 0 8%,#2563eb 23%,#0f3c81 62%,#93c5fd 100%);
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.65)) drop-shadow(0 0 5px rgba(96,165,250,.8));
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.5); animation:tauntGuard 2s ease-in-out infinite;
  }
  .card .taunt-crest::after { content:""; position:absolute; inset:5px; clip-path:inherit; border:1px solid rgba(219,234,254,.72); }
  .card .art {
    flex: 1; border-radius: 6px; margin-bottom: 3px; display: flex; align-items: center; justify-content: center;
    font-size: 42px;

  .card .art.art-fallback { position:relative; isolation:isolate; color:#fff; box-shadow:inset 0 2px 8px rgba(0,0,0,.78),inset 0 0 0 1px color-mix(in srgb,var(--faction-accent,#94a3b8) 34%,transparent),0 0 12px color-mix(in srgb,var(--faction-accent,#94a3b8) 18%,transparent); }

  /* 卡名底帶（CP1-11）*/

  /* 浮動傷害 / 技能提示 */

    pointer-events: none; z-index: 150; animation: dmgFloat .85s ease-out forwards; }
  /* 傷害數字分級（CP1-12）*/

  .dmg-float.dmg-big { color: #fca5a5; font-size: 32px; text-shadow: 0 0 10px #ef4444, 0 0 18px #dc2626, 0 2px 3px #000; }
  /* 命中閃白 + 火花（CP1-12）*/

  @keyframes hitFlash { 0%,100%{filter:none} 40%{filter:brightness(2.6) contrast(1.4)} }
  .hit-spark { position: fixed; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; z-index: 149;
    background: radial-gradient(circle, #fff, #fde047); box-shadow: 0 0 6px #fbbf24;
    transform: translate(-50%, -50%); animation: sparkFly .42s ease-out forwards; }
  @keyframes sparkFly { 0%{opacity:1; transform:translate(-50%,-50%)} 100%{opacity:0; transform:translate(calc(-50% + var(--sx)), calc(-50% + var(--sy)))} }

    animation: kwPop .9s ease-out forwards; white-space: nowrap; }

    .controls .controls-scroll button { width:100%; min-height:40px; padding:8px 10px; border-radius:10px; font-size:12px; white-space:normal; }
    .more-actions-btn {
      display:grid; place-items:center; min-width:0; width:48px; height:44px; border:1px solid rgba(255,255,255,.14);
      border-radius:12px; background:#1a2230; color:var(--ink); font-size:22px; font-weight:900;
      box-shadow:0 3px 10px rgba(0,0,0,.34); cursor:pointer;
    }
    #endTurnBtn, #mulliganBtn {
      position: static; min-width:0; min-height:44px; padding:7px 8px; font-size:12px; border-radius:12px; margin-right:0;
      white-space:normal; line-height:1.15;
    }
    .target-status {
      position: static; min-height: 24px; width: auto; padding: 3px 10px; font-size: 12px;
    }
    #log {
      position: static; width: auto; height: 34px; padding: 4px 10px;
      background: rgba(9,14,22,.9); border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
    }
    .quest-panel {
      position: static; min-height: 44px; max-height: 76px; overflow-y: auto;
      background: rgba(13,20,30,.94);
    }
    .quest-panel h2 { margin-bottom: 2px; }
    /* 任務清單改直向堆疊：由 quest-panel 垂直內捲，不再橫向裁切 */
    .quest-list { display: flex; flex-direction: column; overflow: visible; gap: 6px; padding-bottom: 2px; }
    .quest-item { flex: 0 0 auto; min-height: 44px; padding: 6px; }
    .kw-codex-btn, .chronicle-btn, .mission-drawer-btn { padding-inline:10px; box-shadow:none; }
    .chronicle-modal { align-items:flex-start; padding:50px 8px 8px; }
    .chronicle-card { max-height:calc(100vh - 64px); padding:12px; border-radius:14px; }
    .chronicle-head { align-items:flex-start; }
    .chronicle-card h2 { font-size:20px; text-align:left; }
    .chapter-top { flex-direction:column; }
    .chapter-claim { width:100%; }
    .faction-grid { grid-template-columns:1fr; }
    .mission-drawer { align-items:flex-start; padding:50px 8px 8px; }
    .mission-card { max-height:calc(100vh - 64px); padding:12px; }
    .mission-list { grid-template-columns:1fr; }
    .mission-actions button { padding:8px 9px; }
    .kw-codex-card { max-height: 82vh; padding: 20px; }
    .kw-codex-card button { position: sticky; bottom: 0; }
    .guide-panel { bottom: calc(var(--command-dock-h) + env(safe-area-inset-bottom, 0px) + 12px); padding: 16px; }
    body:has(.hand-drawer.open) .guide-panel { bottom: calc(var(--command-dock-h) + var(--mobile-hand-open) + env(safe-area-inset-bottom, 0px) + 8px); }
    .guide-panel h2 { font-size: 18px; margin-bottom: 8px; }
    .guide-copy { font-size: 13px; }
  }
  @media (max-width: 700px) and (orientation: portrait) {
    header { padding-block: 3px; font-size: 12px; }
    .board { overflow-y: auto; }
    .hero-row { min-height: 38px; padding-block: 3px; }
    .battlefield {
      flex: 1 1 24dvh; min-height: 22dvh; max-height: none; overflow: auto;
      align-items: flex-start; align-content: flex-start;
    }
  }
  /* 命名展示盤：固定材質峰值，截圖不依賴動畫時序。 */
  body.capture-pose *, body.capture-pose *::before, body.capture-pose *::after { animation:none !important; transition:none !important; }
  body.capture-pose .card.rarity-legendary .frame-sheen { background-position:58% 50%; }
  body.capture-pose .card.foil::after { background-position:46% 42%,62% 54%; opacity:.84; }
  body.capture-pose .card.legend-idle { box-shadow:0 0 31px var(--glow),0 0 47px color-mix(in srgb,var(--glow) 72%,transparent),0 5px 13px rgba(0,0,0,.52); }
</style>
</head>
<body>
  <header>⚔️ 卡牌對戰 · CARD BATTLE ⚔️</header>

  <div class="settings-hud">
    <button class="settings-toggle" id="settingsToggleBtn" type="button" aria-label="開啟設定" aria-expanded="false" aria-controls="settingsPanel">⚙</button>
    <div class="settings-panel" id="settingsPanel" aria-hidden="true">
      <label class="diff-pick">難度
        <select id="difficultySel" aria-label="選擇難度">
          <option value="easy" selected>簡單</option>
          <option value="normal">普通</option>
          <option value="hard">困難</option>
        </select>
      </label>
      <label class="diff-pick">對手
        <select id="opponentSel" aria-label="選擇對手">
          <option value="op_ser_halden">🛡️ 哈爾登隊長</option>
          <option value="op_magister_vey">🔮 維伊魔導師</option>
          <option value="op_scarra">🐺 斯卡拉狼首</option>
        </select>
      </label>
      <label class="dda-toggle" title="依近期勝敗小幅調整 AI。可完全關閉。">
        <input id="ddaToggle" type="checkbox" checked />
        <span>動態調節</span>
      </label>
      <label class="ai-thought-toggle" title="在戰鬥紀錄顯示 AI 出牌與攻擊理由。">
        <input id="aiThoughtToggle" type="checkbox" />
        <span>AI 思路</span>
      </label>
      <label class="perf-toggle" title="自動依 FPS 調整動畫密度，也可鎖定高/低。">效能
        <select id="perfModeSel">
          <option value="auto">自動</option>
          <option value="high">高</option>
          <option value="low">低</option>
        </select>
        <span class="perf-diag" id="perfDiag" aria-live="polite">FPS -- · 高動畫 · 自動觀察中</span>
        <span class="perf-history" id="perfHistory" aria-live="polite">紀錄 --</span>
      </label>
      <label class="text-size-toggle">文字
        <select id="textSizeSel" aria-label="文字大小">
          <option value="small">小</option>
          <option value="medium" selected>中</option>
          <option value="large">大</option>
        </select>
      </label>
      <button class="audio-toggle-btn" id="audioToggleBtn" type="button" title="Audio on/off" aria-label="Audio on/off">SFX</button>
    </div>
  </div>

  <div class="board">
    <div class="hero-row">
      <div class="hero" id="enemyHero">
        <span class="avatar">😈</span><span class="name">電腦對手</span>
      </div>
      <div><span class="hp-badge">❤️ <span id="enemyHp">30</span></span></div>
    </div>

    <div class="battlefield enemy" id="enemyField"></div>
    <div class="battlefield" id="playerField"></div>

    <div class="hero-row">
      <div class="player-hero-scene">
        <div class="hero" id="playerHero">
          <span class="avatar">🦸</span><span class="name">你</span>
        </div>
        <button class="scene-hint-btn" id="hintBtn" type="button" title="本回合提示最佳一步" aria-label="取得本回合提示">💡</button>
      </div>
      <div style="display:flex; gap:8px;">
        <span class="mana-badge">💧 <span id="playerMana">1</span>/<span id="playerManaMax">1</span></span>
        <span class="hp-badge">❤️ <span id="playerHp">30</span></span>
      </div>
    </div>

    <div class="target-status" id="targetStatus" aria-live="polite">輪到你行動。</div>
    <div id="log" role="log" aria-live="polite" aria-atomic="false"></div>
    <div class="hand-drawer" id="handDrawer">
      <div class="hand" id="playerHand"></div>
    </div>
    <div class="controls" id="commandDock">
      <div class="primary-actions">
        <button class="mulligan-btn" id="mulliganBtn" style="display:none">🔄 重抽起手牌</button>
        <button class="end-turn" id="endTurnBtn">結束回合 ▶</button>
      </div>
      <div class="desktop-quick-actions" aria-label="主要遊戲行動">
        <button class="mulligan-btn" id="newGameQuickBtn" type="button">重新開始</button>
        <button class="mulligan-btn" id="toPackQuickBtn" type="button">卡包 / 牌組</button>
      </div>
      <button class="hand-drawer-toggle" id="handDrawerToggle" type="button" aria-expanded="false" aria-controls="playerHand">
        <span>🂠 手牌</span><strong id="handCount">0</strong><span class="hand-state" id="handDrawerState">展開</span>
      </button>
      <button class="more-actions-btn" id="moreActionsBtn" type="button" aria-label="更多行動" aria-expanded="false" aria-controls="dockMorePanel">⋯</button>
      <div class="controls-scroll" id="dockMorePanel">
        <button class="mulligan-btn" id="newGameBtn" title="重開一局（會帶入最新收藏的牌組）">🔁 重新開始</button>
        <button class="mulligan-btn" id="toPackBtn" title="前往卡包與牌組編輯器">🃏 卡包／牌組</button>
        <button class="mulligan-btn" id="guideReplayBtn" title="重看三步導引">🧭 導引</button>
        <button class="mission-drawer-btn" id="missionDrawerBtn">任務<span class="mission-badge" id="missionBadge" aria-live="polite">0</span></button>
        <button class="kw-codex-btn" id="kwCodexBtn">📖 關鍵字</button>
        <button class="chronicle-btn" id="chronicleBtn">📜 編年史<span class="chronicle-badge" id="chronicleBadge" aria-live="polite">0</span></button>
      </div>
    </div>

    <section class="quest-panel" id="questPanel">
      <h2><span>每日任務</span><span class="quest-head-actions"><button class="quest-claim-all" id="questClaimAllBtn">全部領取</button><span id="questDateLabel"></span></span></h2>
      <div class="quest-list" id="questList" aria-live="polite"></div>
    </section>

    <footer class="series-footer">
      🎮 阿軒的小遊戲系列
      <a href="https://mars-tw.github.io/tower-defense-skill/" target="_blank" rel="noopener">塔防</a>
      <a href="https://mars-tw.github.io/pixel-idle-farm-skill/" target="_blank" rel="noopener">像素農場</a>
      <a href="https://mars-tw.github.io/ashes-convoy/" target="_blank" rel="noopener">末日射擊</a>
    </footer>
  </div>

  <div class="overlay" id="overlay">
    <h1 id="overlayTitle">勝利！</h1>
    <div class="result-stats" id="resultStats"></div>
    <div class="overlay-actions">
      <button id="restartBtn">再戰一場</button>
      <button class="secondary" id="overlayPackBtn">去開卡包</button>
      <button class="quest-cta" id="overlayQuestBtn">領取任務</button>
    </div>
  </div>

  <!-- 首次遊玩三步導引（R6）-->
  <div class="battle-guide" id="battleGuide" aria-live="polite">
    <div class="guide-panel">
      <h2 id="guideTitle">對戰導引</h2>
      <div class="guide-step-label" id="guideStepLabel">STEP 1 / 3</div>
      <p class="guide-copy" id="guideCopy">點一張發亮的手牌出牌。</p>
      <div class="guide-actions">
        <button class="secondary" id="guideSkipBtn">略過</button>
        <button id="guideHintBtn">我知道了</button>
      </div>
    </div>
  </div>

  <!-- 關鍵字圖鑑（CP0-15 觸控友善）-->
  <div class="kw-codex" id="kwCodex">
    <div class="kw-codex-card">
      <h2>📖 關鍵字圖鑑</h2>
      <div id="kwCodexList"></div>
      <button id="kwCodexClose">關閉</button>
    </div>
  </div>

  <div class="chronicle-modal" id="chronicleModal" aria-hidden="true">
    <div class="chronicle-card">
      <div class="chronicle-head">
        <h2>📜 白潮編年史</h2>
        <button class="chronicle-close" id="chronicleClose" type="button">關閉</button>
      </div>
      <div class="chronicle-tabs" role="tablist" aria-label="編年史分頁">
        <button class="chronicle-tab active" id="chronicleChaptersTab" type="button" role="tab" aria-selected="true">章節列表</button>
        <button class="chronicle-tab" id="chronicleFactionsTab" type="button" role="tab" aria-selected="false">陣營傳說</button>
      </div>
      <section class="chronicle-panel active" id="chronicleChaptersPanel" role="tabpanel" aria-labelledby="chronicleChaptersTab">
        <div class="chapter-list" id="chronicleChapterList" aria-live="polite"></div>
      </section>
      <section class="chronicle-panel" id="chronicleFactionsPanel" role="tabpanel" aria-labelledby="chronicleFactionsTab">
        <div class="faction-grid" id="chronicleFactionList"></div>
      </section>
    </div>
  </div>

  <div class="mission-drawer" id="missionDrawer" aria-hidden="true">
    <div class="mission-card">
      <div class="mission-head">
        <div class="mission-title">任務中心</div>
        <div class="mission-actions">
          <button class="mission-claim-all" id="missionClaimAllBtn">全部領取</button>
          <button class="mission-close" id="missionDrawerClose">關閉</button>
        </div>
      </div>
      <section class="mission-section">
        <h3>每日任務</h3>
        <div class="mission-list" id="missionDailyList" aria-live="polite"></div>
      </section>
      <section class="mission-section">
        <h3>每週任務</h3>
        <div class="mission-list" id="missionWeeklyList" aria-live="polite"></div>
      </section>
      <section class="mission-section">
        <h3>收藏里程碑</h3>
        <div class="mission-list" id="missionMilestoneList" aria-live="polite"></div>
      </section>
    </div>
  </div>

  <div class="card-detail" id="cardDetail" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="card-detail-card">
      <div class="card-detail-head">
        <div class="card-detail-title" id="cardDetailTitle"></div>
        <button class="card-detail-close" id="cardDetailClose" type="button" aria-label="關閉">X</button>
      </div>
      <div class="card-detail-art" id="cardDetailArt"></div>
      <div class="card-detail-meta" id="cardDetailMeta"></div>
      <div class="card-detail-stats" id="cardDetailStats"></div>
      <div class="card-detail-text" id="cardDetailText"></div>
      <div class="card-detail-flavor" id="cardDetailFlavor"></div>
      <div class="card-detail-keywords" id="cardDetailKeywords"></div>
      <div class="detail-keyword-info" id="cardDetailKeywordInfo"></div>
    </div>
  </div>

  <script src="cards.js?v=card-battle-r62-v1"></script>
  <script src="core.js?v=card-battle-r62-v1"></script>
  <script src="battle.js?v=card-battle-r62-v1"></script>
  <script>
    // 接收入口頁的主題切換
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "setTheme") {
        document.documentElement.setAttribute("data-theme", e.data.theme);
      }
    });
    // 初次載入沿用 localStorage 主題
    try { const t = localStorage.getItem("cardgame_theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}

    // 導覽到卡包與牌組編輯器；在入口 iframe 內用分頁切換，單頁開啟時改跳頁
    (function setupPackNav() {
      const btn = document.getElementById("toPackBtn");
      if (!btn) return;
      btn.onclick = () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "switchTab", target: "pack" }, "*");
        } else {
          window.location.href = "../card-pack/index.html";
        }
      };
    })();

    // 難度選擇器：讀取既有設定，換難度時存檔並重開一局
    (function setupDifficulty() {
      const sel = document.getElementById("difficultySel");
      let cur = "easy";
      try { cur = localStorage.getItem("cardgame_difficulty") || "easy"; } catch {}
      sel.value = cur;
      sel.addEventListener("change", () => {
        try { localStorage.setItem("cardgame_difficulty", sel.value); } catch {}
        // 立即以新難度重開一局
        if (window.__newGame) window.__newGame();
      });
    })();

    (function setupOpponent() {
      const sel = document.getElementById("opponentSel");
      if (!sel) return;
      if (window.__opponents) {
        sel.innerHTML = Object.values(window.__opponents).map((opponent) =>
          `<option value="${opponent.id}">${opponent.emoji} ${opponent.name}</option>`
        ).join("");
      }
      let cur = "op_ser_halden";
      try { cur = localStorage.getItem("cardgame_opponent") || "op_ser_halden"; } catch {}
      if ([...sel.options].some((option) => option.value === cur)) sel.value = cur;
      sel.addEventListener("change", () => {
        try { localStorage.setItem("cardgame_opponent", sel.value); } catch {}
        if (window.__newGame) window.__newGame();
      });
    })();

    // 關鍵字圖鑑（CP0-15 觸控友善：手機看不到 title tooltip）
    (function setupCodex() {
      const list = document.getElementById("kwCodexList");
      if (window.KEYWORDS) {
        list.innerHTML = Object.values(window.KEYWORDS).map(kw =>
          `<div class="kw-codex-item"><span class="kwi">${kw.icon}</span><span><span class="kwn">${kw.label}</span><br><span class="kwd">${kw.desc}</span></span></div>`
        ).join("");
      }
      const codex = document.getElementById("kwCodex");
      const openBtn = document.getElementById("kwCodexBtn");
      const closeBtn = document.getElementById("kwCodexClose");
      let codexReturnFocus = null;
      function openCodex() {
        codexReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
        codex.classList.add("show");
        codex.setAttribute("aria-hidden", "false");
        setTimeout(() => closeBtn.focus(), 0);
      }
      function closeCodex() {
        codex.classList.remove("show");
        codex.setAttribute("aria-hidden", "true");
        const restore = codexReturnFocus;
        codexReturnFocus = null;
        if (restore && document.contains(restore)) setTimeout(() => restore.focus(), 0);
      }
      openBtn.onclick = openCodex;
      closeBtn.onclick = closeCodex;
      codex.addEventListener("click", (event) => { if (event.target === codex) closeCodex(); });
      window.__openKwCodex = openCodex;
      window.__closeKwCodex = closeCodex;
      window.__kwCodexOpen = () => codex.classList.contains("show");
    })();
  </script>
</body>
