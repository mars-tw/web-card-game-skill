<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="../manifest.webmanifest" />
<meta name="theme-color" content="#f59e0b" />
<title>卡牌遊戲 · Card Game</title>
<style>
  /* 入口頁主題（影響分頁列底色）*/
  :root { --bar1:#141c28; --bar2:#0f1620; --accent:#f59e0b; --stage:#0f1419; }
  :root[data-theme="fantasy"] { --bar1:#251a0f; --bar2:#160d05; --accent:#f0a830; --stage:#160d05; }
  :root[data-theme="cyber"]   { --bar1:#0d1b2e; --bar2:#04070f; --accent:#2dd4bf; --stage:#04070f; }
  :root[data-theme="forest"]  { --bar1:#122019; --bar2:#07120c; --accent:#84cc16; --stage:#07120c; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    background: var(--stage); color: #e6edf3;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .tabbar {
    display: flex; align-items: center; gap: 4px; padding: 8px 12px;
    background: linear-gradient(180deg, var(--bar1), var(--bar2));
    border-bottom: 1px solid #232f3e; flex-shrink: 0;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 800; letter-spacing: 1px; color: var(--accent);
    text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent);
    margin-right: 12px; font-size: 16px; white-space: nowrap;
  }
  .tab {
    appearance: none; border: none; background: transparent; color: #8b98a8;
    font-size: 15px; font-weight: 700; padding: 10px 22px; border-radius: 10px 10px 0 0;
    cursor: pointer; transition: background .15s, color .15s; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .tab:hover { color: #e6edf3; background: rgba(255,255,255,.04); }
  .tab.active {
    color: #1a1206; background: linear-gradient(180deg, var(--accent), #d97706);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .tab .ico { line-height: 1; }

  /* 主題選擇器（靠右）*/
  .theme-picker { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .theme-picker .lbl { font-size: 12px; color: #8b98a8; }
  .pwa-meta { display:flex; align-items:center; gap:7px; margin-left:10px; color:#8b98a8; font-size:12px; }
  .pwa-meta button { border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#e6edf3;
    border-radius:8px; padding:6px 8px; font:inherit; font-weight:800; cursor:pointer; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    transition: transform .12s, border-color .12s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,.5); }
  .swatch[data-theme="dark"]    { background: linear-gradient(135deg,#3b82f6,#16202e); }
  .swatch[data-theme="fantasy"] { background: linear-gradient(135deg,#f0a830,#2a1d10); }
  .swatch[data-theme="cyber"]   { background: linear-gradient(135deg,#2dd4bf,#0a1626); }
  .swatch[data-theme="forest"]  { background: linear-gradient(135deg,#84cc16,#14241a); }

  .stage { position: relative; flex: 1; min-height: 0; }
  .frame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none;
    background: var(--stage); display: none;
  }
  .frame.active { display: block; }
  .pwa-update {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 20; display: none; align-items: center; gap: 10px;
    max-width: calc(100vw - 24px); padding: 10px 12px; border-radius: 12px;
    background: rgba(15,23,42,.96); color: #e6edf3; border: 1px solid rgba(245,158,11,.45);
    box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 13px; font-weight: 800;
  }
  .pwa-update.show { display: flex; }
  .pwa-update button {
    border: none; border-radius: 9px; padding: 7px 10px; font-weight: 900; cursor: pointer;
    background: linear-gradient(180deg, #f59e0b, #d97706); color: #1a1206;
  }

  @media (max-width: 700px) {
    .tabbar { gap: 6px; padding: 6px 8px; min-height: 56px; overflow: hidden; }
    .brand { margin-right: 0; font-size: 0; flex: 0 0 auto; }
    .brand-icon { font-size: 22px; }
    .brand-text { display: none; }
    .tab { min-width: 72px; padding: 8px 10px; border-radius: 12px; font-size: 12px; flex-direction: column; gap: 3px; line-height: 1.05; }
    .tab .ico { font-size: 18px; }
    .theme-picker { margin-left: auto; gap: 5px; flex: 0 0 auto; }
    .theme-picker .lbl { display: none; }
    .swatch { width: 24px; height: 24px; }
    .pwa-meta { display:none; }
  }

  @media (max-width: 390px) {
    .tabbar { gap: 4px; padding-inline: 6px; }
    .tab { min-width: 64px; padding-inline: 7px; font-size: 11px; }
    .swatch { width: 22px; height: 22px; }
  }
</style>
</head>
<body>
  <nav class="tabbar">
    <span class="brand"><span class="brand-icon">🎴</span><span class="brand-text">卡牌遊戲</span></span>
    <button class="tab active" data-target="battle"><span class="ico">⚔️</span>對戰</button>
    <button class="tab" data-target="pack"><span class="ico">🎁</span>開卡包</button>

    <div class="theme-picker">
      <span class="lbl">主題</span>
      <div class="swatch" data-theme="dark"    title="暗黑"></div>
      <div class="swatch" data-theme="fantasy" title="奇幻"></div>
      <div class="swatch" data-theme="cyber"   title="科幻"></div>
      <div class="swatch" data-theme="forest"  title="森林"></div>
    </div>
    <div class="pwa-meta" aria-label="PWA 版本">
      <span id="pwaVersion">版本讀取中</span>
      <button id="pwaCheckBtn" type="button">檢查更新</button>
    </div>
  </nav>

  <div class="stage">
    <iframe id="battle" class="frame active" src="card-battle/index.html" title="卡牌對戰"></iframe>
    <iframe id="pack"   class="frame"        src="card-pack/index.html"   title="開卡包"></iframe>
  </div>
  <div class="pwa-update" id="pwaUpdateToast">
    <span>新版本可用</span>
    <button id="pwaReloadBtn" type="button">重新載入</button>
  </div>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const frames = document.querySelectorAll(".frame");
    const swatches = document.querySelectorAll(".swatch");

    function switchTab(target) {
      tabs.forEach((t) => t.classList.toggle("active", t.dataset.target === target));
      frames.forEach((f) => f.classList.toggle("active", f.id === target));
    }
    tabs.forEach((tab) => tab.addEventListener("click", () => switchTab(tab.dataset.target)));

    // 主題切換：套用到入口頁 + 廣播給兩個 iframe + 存 localStorage
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "" : theme);
      swatches.forEach((s) => s.classList.toggle("active", s.dataset.theme === theme));
      try { localStorage.setItem("cardgame_theme", theme === "dark" ? "" : theme); } catch {}
      frames.forEach((f) => {
        try { f.contentWindow.postMessage({ type: "setTheme", theme: theme === "dark" ? "" : theme }, "*"); } catch {}
      });
    }
    swatches.forEach((s) => s.addEventListener("click", () => applyTheme(s.dataset.theme)));

    // 子頁要求切換分頁
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "switchTab" && e.data.target) switchTab(e.data.target);
    });

    // 初始化：套用已存主題（iframe 載入後再廣播一次確保同步）
    const saved = (() => { try { return localStorage.getItem("cardgame_theme") || "dark"; } catch { return "dark"; } })();
    const initial = saved || "dark";
    document.documentElement.setAttribute("data-theme", initial === "dark" ? "" : initial);
    swatches.forEach((s) => s.classList.toggle("active", s.dataset.theme === (initial || "dark")));
    frames.forEach((f) => f.addEventListener("load", () => {
      try { f.contentWindow.postMessage({ type: "setTheme", theme: initial === "dark" ? "" : initial }, "*"); } catch {}
    }));

    const pwaState = { skippedForWebdriver: false, registered: false, updatePrompted: false, version: "", checking: false };
    function swUrl() { return new URL("../sw.js", location.href).toString(); }
    async function readCacheVersion() {
      try {
        const text = await fetch(swUrl(), { cache: "no-store" }).then((res) => res.text());
        const match = text.match(/CACHE_VERSION\s*=\s*"([^"]+)"/);
        pwaState.version = match ? match[1] : "unknown";
      } catch {
        pwaState.version = "unknown";
      }
      const label = document.getElementById("pwaVersion");
      if (label) label.textContent = `版本 ${pwaState.version}`;
      return pwaState.version;
    }
    function showPwaUpdate() {
      pwaState.updatePrompted = true;
      const toast = document.getElementById("pwaUpdateToast");
      if (toast) toast.classList.add("show");
    }
    let pwaReloading = false;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (pwaReloading) return;
        pwaReloading = true;
        location.reload();
      });
    }
    function applyWaitingWorker(registration) {
      if (registration && registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
      else location.reload();
    }
    document.getElementById("pwaReloadBtn").addEventListener("click", async () => {
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration("../") : null;
      applyWaitingWorker(reg);
    });
    async function registerPwa() {
      if (!("serviceWorker" in navigator)) return pwaState;
      const allowWebdriver = new URLSearchParams(location.search).get("swtest") === "1";
      if (navigator.webdriver && !allowWebdriver) {
        pwaState.skippedForWebdriver = true;
        return pwaState;
      }
      try {
        const registration = await navigator.serviceWorker.register("../sw.js");
        pwaState.registered = true;
        registration.addEventListener("updatefound", () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) showPwaUpdate();
          });
        });
        if (registration.waiting && navigator.serviceWorker.controller) showPwaUpdate();
      } catch {}
      return pwaState;
    }
    async function checkForUpdate() {
      pwaState.checking = true;
      await readCacheVersion();
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration("../") : null;
      if (reg) {
        await reg.update();
        if (reg.waiting) {
          showPwaUpdate();
          applyWaitingWorker(reg);
        }
      }
      pwaState.checking = false;
      return pwaState;
    }
    document.getElementById("pwaCheckBtn").addEventListener("click", () => checkForUpdate());
    window.__pwaTest = { state: pwaState, registerPwa, showPwaUpdate, readCacheVersion, checkForUpdate };
    readCacheVersion();
    registerPwa();
  </script>
</body>
</html>
